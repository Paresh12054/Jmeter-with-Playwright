name: Test Confluence JTL Attachment

on:
  workflow_dispatch:

jobs:
  attach-jtl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JTL file
        run: |
          echo "Checking JTL file..."
          ls -lh data/Rovo_Test1.jtl

      - name: Test Confluence Page Access
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |

          PAGE_ID="6094858"

          echo "===================================="
          echo "Confluence configuration"
          echo "===================================="

          echo "Base URL:"
          echo "${CONFLUENCE_BASE_URL}"

          echo "Page ID:"
          echo "${PAGE_ID}"

          AUTH=$(printf '%s:%s' \
            "$CONFLUENCE_EMAIL" \
            "$CONFLUENCE_API_TOKEN" | base64 -w 0)

          echo ""
          echo "Testing page access..."

          curl -i \
            -u "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${CONFLUENCE_BASE_URL%/}/wiki/rest/api/content/${PAGE_ID}"
