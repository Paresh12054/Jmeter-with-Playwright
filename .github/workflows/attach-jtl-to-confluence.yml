name: Attach Rovo JTL to Confluence

on:
  workflow_dispatch:

jobs:
  upload-jtl:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check JTL File
        run: |
          echo "Checking JTL file..."
          ls -lh data/Rovo_Test1.jtl

      - name: Upload JTL to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}

        run: |

          PAGE_ID="6094858"
          FILE="data/Rovo_Test1.jtl"

          echo "Uploading $FILE"
          echo "Target Confluence Page ID: $PAGE_ID"

          HTTP_STATUS=$(curl -s \
            -o response.txt \
            -w "%{http_code}" \
            -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -X POST \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@$FILE" \
            "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment")

          echo "HTTP Status: $HTTP_STATUS"

          echo "Confluence response:"
          cat response.txt

          if [ "$HTTP_STATUS" = "200" ]; then
            echo ""
            echo "✅ Rovo_Test1.jtl successfully attached to Confluence"
          else
            echo ""
            echo "❌ JTL upload failed"
            exit 1
          fi
