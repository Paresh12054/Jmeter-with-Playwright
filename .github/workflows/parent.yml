name: Confluence Folder Automation

on:
  workflow_dispatch:

jobs:
  confluence-job:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
      FOLDER_ID: "5144580"

    steps:
      - name: Run Confluence Script
        uses: actions/github-script@v7
        with:
          script: |
            const baseUrl = process.env.CONFLUENCE_BASE_URL;
            const email = process.env.CONFLUENCE_EMAIL;
            const token = process.env.CONFLUENCE_API_TOKEN;
            const spaceKey = process.env.CONFLUENCE_SPACE_KEY;
            const folderId = process.env.FOLDER_ID;

            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json"
            };

            const now = new Date().toISOString();
            const pageTitle = `Test Page ${now}`;

            // 🔹 API helper
            async function api(url, method = "GET", body = null) {
              const res = await fetch(url, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
              });

              if (!res.ok) {
                throw new Error(`${method} ${url} failed: ${await res.text()}`);
              }

              return res.json();
            }

            // 1️⃣ CREATE CHILD PAGE
            const childPage = await api(`${baseUrl}/rest/api/content`, "POST", {
              type: "page",
              title: pageTitle,
              ancestors: [{ id: folderId }],
              space: { key: spaceKey },
              body: {
                storage: {
                  value: `<p>Test</p><p>Created at ${now}</p>`,
                  representation: "storage"
                }
              }
            });

            const childLink = baseUrl.replace("/wiki", "") + childPage._links.webui;

            console.log("✅ Child page created:", childLink);

            // 2️⃣ FIND INDEX PAGE
            const searchRes = await api(
              `${baseUrl}/rest/api/content?title=Index Page&spaceKey=${spaceKey}&expand=version,body.storage`
            );

            let indexPage = searchRes.results.find(p => 
              p.ancestors?.some(a => a.id === folderId)
            );

            // 3️⃣ CREATE INDEX PAGE IF NOT EXISTS
            if (!indexPage) {
              console.log("📄 Creating Index Page...");

              indexPage = await api(`${baseUrl}/rest/api/content`, "POST", {
                type: "page",
                title: "Index Page",
                ancestors: [{ id: folderId }],
                space: { key: spaceKey },
                body: {
                  storage: {
                    value: `
                      <h2>Child Pages Log</h2>
                      <table>
                        <tr>
                          <th>Created At</th>
                          <th>Page</th>
                        </tr>
                      </table>
                    `,
                    representation: "storage"
                  }
                }
              });
            }

            // 4️⃣ ALWAYS FETCH LATEST VERSION (IMPORTANT FIX)
            const latest = await api(
              `${baseUrl}/rest/api/content/${indexPage.id}?expand=body.storage,version`
            );

            let content = latest.body.storage.value;
            const currentVersion = latest.version.number;

            // 5️⃣ PREVENT DUPLICATES
            if (content.includes(childLink)) {
              console.log("⚠️ Entry already exists, skipping update");
              return;
            }

            // 6️⃣ CREATE NEW ROW (NEWEST ON TOP)
            const newRow = `
              <tr>
                <td>${now}</td>
                <td><a href="${childLink}">${pageTitle}</a></td>
              </tr>
            `;

            // 7️⃣ INSERT ROW SAFELY
            if (content.match(/<\/table>/i)) {
              // insert after header row (top of table)
              content = content.replace(
                /(<table[^>]*>\s*<tr>.*?<\/tr>)/is,
                `$1${newRow}`
              );
            } else {
              console.log("⚠️ Table missing, recreating...");
              content += `
                <h2>Child Pages Log</h2>
                <table>
                  <tr>
                    <th>Created At</th>
                    <th>Page</th>
                  </tr>
                  ${newRow}
                </table>
              `;
            }

            // 8️⃣ UPDATE INDEX PAGE
            await api(`${baseUrl}/rest/api/content/${indexPage.id}`, "PUT", {
              id: indexPage.id,
              type: "page",
              title: latest.title,
              version: { number: currentVersion + 1 },
              body: {
                storage: {
                  value: content,
                  representation: "storage"
                }
              }
            });

            console.log("✅ Index page updated successfully");
