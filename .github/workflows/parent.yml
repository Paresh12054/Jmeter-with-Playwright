name: Confluence Folder Automation

on:
  workflow_dispatch:

jobs:
  confluence-job:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
      FOLDER_ID: "5505025"
      INDEX_PAGE_ID: "5505025"

    steps:
      - name: Run Confluence Script
        uses: actions/github-script@v7
        with:
          script: |
            const baseUrl = process.env.CONFLUENCE_BASE_URL;
            const email = process.env.CONFLUENCE_EMAIL;
            const token = process.env.CONFLUENCE_API_TOKEN;
            const spaceKey = process.env.CONFLUENCE_SPACE_KEY;
            const folderId = process.env.FOLDER_ID;
            const indexPageId = process.env.INDEX_PAGE_ID;

            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json"
            };

            // ✅ Clean date format
            const now = new Date().toLocaleString("en-GB").replace(",", "");
            const pageTitle = `Test Page ${now}`;

            async function api(url, method = "GET", body = null) {
              const res = await fetch(url, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
              });

              const text = await res.text();

              if (!res.ok) {
                throw new Error(`${method} ${url} failed:\n${text}`);
              }

              return text ? JSON.parse(text) : {};
            }

            // ✅ STEP 1: CREATE CHILD PAGE
            const childPage = await api(`${baseUrl}/rest/api/content`, "POST", {
              type: "page",
              title: pageTitle,
              ancestors: [{ id: folderId }],
              space: { key: spaceKey },
              body: {
                storage: {
                  value: `<p>Test</p><p>Created at ${now}</p>`,
                  representation: "storage"
                }
              }
            });

            const childLink = baseUrl.replace("/wiki", "") + childPage._links.webui;

            console.log("✅ Child page created:", childLink);

            // ✅ STEP 2: FETCH INDEX PAGE
            const indexPage = await api(
              `${baseUrl}/rest/api/content/${indexPageId}?expand=body.storage,version`
            );

            if (indexPage.type !== "page") {
              throw new Error("❌ INDEX_PAGE_ID is NOT a page.");
            }

            if (!indexPage.body || !indexPage.body.storage) {
              throw new Error("❌ Index page body missing.");
            }

            let content = indexPage.body.storage.value;
            const currentVersion = indexPage.version.number;

            // ✅ STEP 3: PREVENT DUPLICATE
            if (content.includes(childLink)) {
              console.log("⚠️ Entry already exists, skipping update");
              return;
            }

            // ✅ STEP 4: NEW ROW (always Sr.No = 1 initially)
            let newRow = `
              <tr style="background-color:#E3FCEF;">
                <td>1</td>
                <td>${now}</td>
                <td><a href="${childLink}"><strong>${pageTitle}</strong></a></td>
                <td>
                  <ac:structured-macro ac:name="status">
                    <ac:parameter ac:name="colour">Green</ac:parameter>
                    <ac:parameter ac:name="title">SUCCESS</ac:parameter>
                  </ac:structured-macro>
                </td>
              </tr>
            `;

            // ✅ STEP 5: REBUILD TABLE WITH UPDATED SERIAL NUMBERS

            let rows = [];

            // Extract existing rows (excluding header)
            const existingRows = content.match(/<tr[\s\S]*?<\/tr>/gi);

            if (existingRows && existingRows.length > 1) {
              // skip header row
              const dataRows = existingRows.slice(1);

              // remove old serial numbers
              rows = dataRows.map(row => {
                return row.replace(/<td>.*?<\/td>/, ""); // remove first column
              });
            }

            // Add new row at top (without modifying structure)
            rows.unshift(newRow);

            // Rebuild rows with correct serial numbers
            rows = rows.map((row, index) => {
              const srNo = index + 1;

              // replace first <td> or insert if missing
              if (row.includes("<td>")) {
                return row.replace(/<td>.*?<\/td>/, `<td>${srNo}</td>`);
              } else {
                return row.replace("<tr", `<tr><td>${srNo}</td>`);
              }
            });

            const rebuiltRows = rows.join("");

            // ✅ STEP 6: REPLACE TABLE CONTENT
            if (content.includes("</tbody>")) {
              content = content.replace(
                /<tbody>[\s\S]*?<\/tbody>/,
                `<tbody>
                  <tr>
                    <th>Sr.No</th>
                    <th>Created At</th>
                    <th>Page</th>
                    <th>Status</th>
                  </tr>
                  ${rebuiltRows}
                </tbody>`
              );
            } else if (content.includes("</table>")) {
              content = content.replace(
                /<table[\s\S]*?<\/table>/,
                `<table>
                  <tbody>
                    <tr>
                      <th>Sr.No</th>
                      <th>Created At</th>
                      <th>Page</th>
                      <th>Status</th>
                    </tr>
                    ${rebuiltRows}
                  </tbody>
                </table>`
              );
            } else {
              console.log("⚠️ No table found → creating dashboard");

              content += `
                <h1>📊 Automation Dashboard</h1>

                <p><strong>Last Updated:</strong> ${now}</p>

                <ac:structured-macro ac:name="panel">
                  <ac:parameter ac:name="title">📄 Child Page Activity</ac:parameter>
                  <ac:rich-text-body>

                    <table>
                      <tbody>
                        <tr>
                          <th>Sr.No</th>
                          <th>Created At</th>
                          <th>Page</th>
                          <th>Status</th>
                        </tr>
                        ${rebuiltRows}
                      </tbody>
                    </table>

                  </ac:rich-text-body>
                </ac:structured-macro>
              `;
            }

            // ✅ STEP 7: UPDATE PAGE
            await api(`${baseUrl}/rest/api/content/${indexPageId}`, "PUT", {
              id: indexPageId,
              type: "page",
              title: indexPage.title,
              version: { number: currentVersion + 1 },
              body: {
                storage: {
                  value: content,
                  representation: "storage"
                }
              }
            });

            console.log("✅ Index page updated with auto-reordered Sr.No");
