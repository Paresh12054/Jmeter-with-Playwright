name: Integration with HTML

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Give execute permission
        run: chmod +x libraries/*.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: jmeter
          key: jmeter-5.6.3
      
      - name: Install JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: bash libraries/install-jmeter.sh

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Playwright
        run: bash libraries/install-playwright.sh

      - name: Install ZAP
        run: bash libraries/install-zap.sh

      - name: Load SLA Config
        run: |
          echo "SLA_AVG=$(jq -r '.avg_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_P90=$(jq -r '.p90_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_ERR=$(jq -r '.error_percent' config/sla.json)" >> $GITHUB_ENV

      - name: Start JMeter
        run: |
          date +"%Y-%m-%d %H:%M:%S" > jm_start.txt
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined1.jmx -l results.jtl -Jduration=180 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      - name: Run Playwright periodically
        shell: bash
        run: |
          mkdir -p pw-results
          date +"%Y-%m-%d %H:%M:%S" > pw_start.txt
      
          END=$((SECONDS+180))
          PASSED=0
          FAILED=0
      
          RUN_INDEX=1
          RUN_SUMMARY_FILE=pw_runs_summary.txt
      
          echo "Run,Start,End,Duration(sec),Passed,Failed" > $RUN_SUMMARY_FILE
      
          while [ $SECONDS -lt $END ]; do
      
            TS_START=$(date +"%Y-%m-%d %H:%M:%S")
            START_SEC=$(date +%s)
      
            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            FILE="pw-results/result-$TS.json"
      
            REPORT_DIR="playwright-report-$RUN_INDEX"
      
            PLAYWRIGHT_HTML_REPORT=$REPORT_DIR \
            npx playwright test tests/Demo1.spec.ts \
              --reporter=json,html \
              > "$FILE" || true
      
            END_SEC=$(date +%s)
            TS_END=$(date +"%Y-%m-%d %H:%M:%S")
      
            DURATION=$((END_SEC - START_SEC))
      
            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects | select(.status=="failed")] | length' "$FILE")
      
              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            else
              P=0
              F=0
            fi
      
            echo "$RUN_INDEX,$TS_START,$TS_END,$DURATION,$P,$F" >> $RUN_SUMMARY_FILE
      
            RUN_INDEX=$((RUN_INDEX+1))
      
            sleep 90
      
          done
      
          date +"%Y-%m-%d %H:%M:%S" > pw_end.txt
      
          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt

      - name: Generate Playwright HTML Screenshot
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');
          (async () => {
      
            const browser = await chromium.launch({
              headless: true
            });
      
            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 900
              }
            });
      
            const reports = fs.readdirSync('.')
              .filter(f => f.startsWith('playwright-report-'))
              .sort();
            
            const latestReport = reports[reports.length - 1];
            
            const htmlPath =
              'file://' + path.resolve(`${latestReport}/index.html`);
      
            await page.goto(htmlPath, {
              waitUntil: 'networkidle'
            });
      
            await page.screenshot({
              path: 'playwright-report.png',
              fullPage: true
            });
      
            await browser.close();
      
            console.log('Playwright screenshot created');
      
          })();
          EOF

      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true
          date +"%Y-%m-%d %H:%M:%S" > jm_end.txt

      - name: Zip Playwright HTML Report
        run: |
          zip -r playwright-report.zip playwright-report*

      - name: Generate JMeter HTML Report
        run: bash libraries/generate-jmeter-report.sh

      - name: Generate JMeter Dashboard Screenshots
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');
      
          (async () => {
      
            const browser = await chromium.launch({
              headless: true
            });
      
            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1200
              }
            });
      
            const reportPath =
              'file://' + path.resolve('jmeter-report/index.html');
      
            console.log("Opening JMeter dashboard...");
      
            await page.goto(reportPath, {
              waitUntil: 'networkidle',
              timeout: 120000
            });
      
            // Wait for graphs to render
            await page.waitForTimeout(5000);
      
            // Full dashboard screenshot
            await page.screenshot({
              path: 'jmeter-dashboard-full.png',
              fullPage: true
            });
      
            console.log("Full dashboard screenshot created");
      
            // Create graph folder
            if (!fs.existsSync('jm-graphs')) {
              fs.mkdirSync('jm-graphs');
            }
      
            // Capture chart canvases
            const charts = await page.locator('canvas').all();
      
            console.log(`Found ${charts.length} charts`);
            if (charts.length === 0) {
              console.log("No charts found in dashboard");
            }
            for (let i = 0; i < charts.length; i++) {
      
              try {
      
                const chartPath = `jm-graphs/chart-${i + 1}.png`;
      
                await charts[i].screenshot({
                  path: chartPath
                });
      
                console.log(`Saved ${chartPath}`);
      
              } catch (err) {
      
                console.log(`Failed chart ${i + 1}: ${err.message}`);
      
              }
            }
      
            await browser.close();
      
            console.log("JMeter screenshots generation completed");
      
          })();
          EOF

      
      - name: Prepare JTL for AI
        run: |
          echo "Preparing JTL sample for AI..."

          # keep header + data
          head -n 1 results.jtl > jtl_sample.txt
          cut -d',' -f1-8 results.jtl | tail -n 2000 >> jtl_sample.txt

          echo "JTL sample ready"

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://owasp.org/www-project-juice-shop/ \
            -r zap-report.html \
            -J zap-report.json \
            -I || true
          ls -l zap-report.*

      - name: Generate ZAP Screenshot
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 900
              }
            });

            const htmlPath = 'file://' + path.resolve('zap-report.html');

            await page.goto(htmlPath, {
              waitUntil: 'networkidle'
            });

            await page.screenshot({
              path: 'zap-report.png',
              fullPage: true
            });

            await browser.close();

            console.log('ZAP screenshot created');

          })();
          EOF

      - name: Generate ZAP Summary
        run: bash libraries/generate-zap-summary.sh

      - name: Generate Aggregate Table
        run: |
          echo "<table border='1' style='border-collapse: collapse;'>" > agg.html
          echo "<tr>
          <th>Transaction</th>
          <th>Total</th>
          <th>Avg (ms)</th>
          <th>P90 (ms)</th>
          <th>P95 (ms)</th>
          <th>Error %</th>
          <th>Avg SLA</th>
          <th>P90 SLA</th>
          <th>Overall SLA</th>
          </tr>" >> agg.html
          awk -v sla_avg="$SLA_AVG" -v sla_p90="$SLA_P90" -F',' '
          NR>1 {
            label=$3
            success=tolower($8)
            gsub(/\r/,"",success)
            gsub(/^[ \t"]+|[ \t"]+$/, "", success)
            if (label ~ /^PT[0-9]+_/) {
              total[label]++
              sum[label]+=$2
              if (success == "false" || success == "0") fail[label]++
              times[label]=times[label] " " $2
            }
          }
          END {
            # 🔹 Transaction-level rows
            for (l in total) {
            n=split(times[l], arr, " ")
            idx=0
            delete clean
            for(i=1;i<=n;i++){
            if(arr[i]!="") clean[++idx]=arr[i]
            }
            n=idx

            for(i=1;i<=n;i++){
            for(j=i+1;j<=n;j++){
            if(clean[i]>clean[j]){
            tmp=clean[i]; clean[i]=clean[j]; clean[j]=tmp
            }
          }
          }

            p90_index = int((n*90 + 99)/100)
            p95_index = int((n*95 + 99)/100)

            p90 = clean[p90_index]
            p95 = clean[p95_index]

            avg = int(sum[l]/total[l])
            err = (total[l] > 0) ? (fail[l]/total[l])*100 : 0

            avg_sla = (avg <= sla_avg) ? "PASS" : "FAIL"
            p90_sla = (p90 <= sla_p90) ? "PASS" : "FAIL"
            overall = (avg_sla=="PASS" && p90_sla=="PASS") ? "PASS" : "FAIL"

            printf "<tr>"
            printf "<td>%s</td>", l
            printf "<td>%d</td>", total[l]
            printf "<td>%d</td>", avg
            printf "<td>%d</td>", p90
            printf "<td>%d</td>", p95
            printf "<td>%.2f</td>", err

            printf "<td>%s</td>", (avg_sla=="PASS") ? "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro>" : "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro>"

            printf "<td>%s</td>", (p90_sla=="PASS") ? "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro>" : "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro>"
  
            printf "<td>%s</td>", (overall=="PASS") ? "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro>" : "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro>"

            printf "</tr>\n"
            }

            # 🔹 TOTAL CALCULATION
            total_all=0
            sum_all=0
            fail_all=0
            times_all=""

            for (l in total) {
            total_all += total[l]
            sum_all += sum[l]
            fail_all += (fail[l] ? fail[l] : 0)
            times_all = times_all " " times[l]
          }

            n=split(times_all, arr, " ")
  
            idx=0
            delete clean_all
            for(i=1;i<=n;i++){
            if(arr[i]!="") clean_all[++idx]=arr[i]
          }
            n=idx

            for(i=1;i<=n;i++){
            for(j=i+1;j<=n;j++){
            if(clean_all[i]>clean_all[j]){
            tmp=clean_all[i]; clean_all[i]=clean_all[j]; clean_all[j]=tmp
            }
            }
            }

            p90_index = int((n*90 + 99)/100)
            p90_all = clean_all[p90_index]

            avg_all = int(sum_all/total_all)
            err_all = (total_all > 0) ? (fail_all/total_all)*100 : 0
    
            printf "<tr style=\"font-weight:bold;background:#f2f2f2\">"
            printf "<td>TOTAL</td>"
            printf "<td>%d</td>", total_all
            printf "<td>%d</td>", avg_all
            printf "<td>%d</td>", p90_all
            printf "<td>-</td>"
            printf "<td>%.2f</td>", err_all
            printf "<td>-</td><td>-</td><td>-</td>"
            printf "</tr>\n"
            }' results.jtl >> agg.html
             echo "</table>" >> agg.html

      - name: Generate JSON Summary for AI
        run: bash libraries/prepare-ai-summary.sh

      - name: Analyze with OpenAI
        env:
          AMPLIFY_TOKEN: ${{ secrets.AMPLIFY_TOKEN }}
          AMPLIFY_BASE_URL: https://amplify.planittesting.com
        run: |
          echo "Calling OpenAI for analysis..."
                 
          RESPONSE=$(curl -s \
            -X POST "${AMPLIFY_BASE_URL}/external/api/completion_prompt" \
            -H "token: ${AMPLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
            --rawfile data ai_summary.json \
            '{
            messages: [
            {
              role: "system",
              content: "You are a performance testing expert. Analyze JMeter results and provide summary, observations, SLA status, and recommendations.Use ONLY the provided data. Do NOT infer or estimate request counts. All totals must match the input exactly."
            },
            {
              role: "user",
              content: ("Analyze the following performance test results (JSON format). Use the request counts exactly as provided. Do not estimate.\n\n" + $data)
            }
          ]
          }')")

          echo "$RESPONSE" > amplify_response.json 
          echo "===== Amplify RAW RESPONSE =====" 
          cat amplify_response.json 
          # Try extracting response safely AI_OUTPUT=$(jq -r '.output // .response // .message // .' amplify_response.json) 
           AI_OUTPUT=$(jq -r '.assistant_resp // .output // .response // .' amplify_response.json)

          echo "$AI_OUTPUT" > ai_summary.txt

          echo "AI_SUMMARY<<EOF" >> $GITHUB_ENV
          cat ai_summary.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        
      - name: Extract TOTAL Metrics
        run: |
          TOTAL_ROW=$(grep "TOTAL" agg.html)

          TOTAL_AVG=$(echo "$TOTAL_ROW" | sed -E 's/.*<td>TOTAL<\/td><td>[0-9]+<\/td><td>([0-9]+)<\/td>.*/\1/')
          TOTAL_P90=$(echo "$TOTAL_ROW" | sed -E 's/.*<td>TOTAL<\/td><td>[0-9]+<\/td><td>[0-9]+<\/td><td>([0-9]+)<\/td>.*/\1/')

          echo "TOTAL_AVG=$TOTAL_AVG" >> $GITHUB_ENV
          echo "TOTAL_P90=$TOTAL_P90" >> $GITHUB_ENV

                    
      - name: Evaluate Overall SLA Status
        run: |
          if grep -q ">FAIL<" agg.html; then
          echo "OVERALL_STATUS=FAIL" >> $GITHUB_ENV
          else
          echo "OVERALL_STATUS=SUCCESS" >> $GITHUB_ENV
          fi

      - name: Extract Duration from JTL
        run: |
          START=$(awk -F',' 'NR==2 {print $1}' results.jtl)
          END=$(awk -F',' 'END {print $1}' results.jtl)

          DURATION_MS=$((END - START))
          DURATION_SEC=$((DURATION_MS / 1000))

          echo "TEST_DURATION=${DURATION_SEC} sec" >> $GITHUB_ENV 

      - name: Extract Total Concurrent Users
        run: |
          USERS=$(grep -oP '(?<=ThreadGroup.num_threads">)\d+' scripts/GithubTest_combined1.jmx | awk '{sum+=$1} END {print sum}')

          echo "CONCURRENT_USERS=$USERS" >> $GITHUB_ENV

      - name: Publish to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
      
        run: |
          node libraries/publish-to-confluence.js

      - name: Upload Attachments
        run: |
          set +e

          upload() {
            FILE=$1
            if [ -f "$FILE" ]; then
              curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
                -X POST -H "X-Atlassian-Token: no-check" \
                -F "file=@$FILE" \
                "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"
            fi
          }

          upload results.jtl

          zip -r jmeter-report.zip jmeter-report
          upload jmeter-report.zip

          upload zap-report.html

          if [ -d "pw-results" ]; then
            for f in pw-results/*.json; do
              [ -f "$f" ] && upload "$f"
            done
          fi
