name: JMeter + Playwright + Confluence

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - uses: actions/checkout@v4

      # -------------------------
      # Install tools
      # -------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      # -------------------------
      # Install JMeter
      # -------------------------
      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      # -------------------------
      # Start JMeter
      # -------------------------
      - name: Start JMeter
        run: |
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      # -------------------------
      # Run Playwright
      # -------------------------
      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results

          END=$((SECONDS+600))
          PASSED=0
          FAILED=0

          START_TIME=$(date +%s)

          while [ $SECONDS -lt $END ]; do
            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            FILE="pw-results/result-$TS.json"

            OUTPUT=$(npx playwright test tests/Demo1.spec.ts --reporter=json || true)
            echo "$OUTPUT" > "$FILE"

            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects | select(.status=="failed")] | length' "$FILE")

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            fi

            sleep 180
          done

          END_TIME=$(date +%s)

          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt
          echo $((END_TIME - START_TIME)) > pw_duration.txt

      # -------------------------
      # Stop JMeter
      # -------------------------
      - name: Stop JMeter
        run: kill $(cat jmeter.pid) || true

      # -------------------------
      # Extract JMeter Metrics
      # -------------------------
      - name: Extract Metrics
        run: |
          TOTAL=$(($(wc -l < results.jtl) - 1))
          FAIL=$(awk -F',' 'NR>1 && $8!="true"{c++}END{print c+0}' results.jtl)

          AVG=$(awk -F',' 'NR>1{sum+=$2;c++}END{print int(sum/c)}' results.jtl)

          P90=$(awk -F',' 'NR>1{print $2}' results.jtl | sort -n | awk '{a[NR]=$1}END{print a[int(NR*0.9)]}')
          P95=$(awk -F',' 'NR>1{print $2}' results.jtl | sort -n | awk '{a[NR]=$1}END{print a[int(NR*0.95)]}')

          USERS=$(awk -F',' 'NR>1{if($13>m)m=$13}END{print m+0}' results.jtl)

          START=$(awk -F',' 'NR==2{print $1}' results.jtl)
          END=$(awk -F',' 'END{print $1}' results.jtl)

          DUR=$(( (END-START)/1000 ))
          [ "$DUR" -eq 0 ] && DUR=1

          THR=$(awk "BEGIN {printf \"%.2f\", ($TOTAL/$DUR)}")
          ERR=$(awk "BEGIN {printf \"%.2f\", ($FAIL/$TOTAL)*100}")

          echo $AVG > avg.txt
          echo $ERR > err.txt
          echo $P90 > p90.txt
          echo $P95 > p95.txt
          echo $USERS > users.txt
          echo $DUR > dur.txt
          echo $THR > thr.txt
          echo $TOTAL > total.txt
          echo $FAIL > fail.txt

      # -------------------------
      # Debug
      # -------------------------
      - name: Debug Files
        run: |
          echo "===== DEBUG ====="
          ls -R
          echo "================="

      # -------------------------
      # Upload Artifacts
      # -------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results.jtl

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: pw-results

      # -------------------------
      # Publish to Confluence (UX IMPROVED)
      # -------------------------
      - name: Publish to Confluence
        run: |
          TS=$(date +"%Y-%m-%d %H:%M:%S")

          CONTENT="
          <h1>🚀 Performance & UI Test Report</h1>

          <p><b>Execution Time:</b> $TS</p>

          <h2>📊 JMeter Summary</h2>
          <table border='1' style='border-collapse: collapse;'>
          <tr><th>Metric</th><th>Value</th></tr>
          <tr><td>Total Requests</td><td>$(cat total.txt)</td></tr>
          <tr><td>Failures</td><td>$(cat fail.txt)</td></tr>
          <tr><td>Error %</td><td>$(cat err.txt)</td></tr>
          <tr><td>Avg Response</td><td>$(cat avg.txt) ms</td></tr>
          <tr><td>P90</td><td>$(cat p90.txt)</td></tr>
          <tr><td>P95</td><td>$(cat p95.txt)</td></tr>
          <tr><td>Throughput</td><td>$(cat thr.txt) req/sec</td></tr>
          <tr><td>Users</td><td>$(cat users.txt)</td></tr>
          <tr><td>Duration</td><td>$(cat dur.txt) sec</td></tr>
          </table>

          <h2>🎭 Playwright Summary</h2>
          <table border='1' style='border-collapse: collapse;'>
          <tr><th>Metric</th><th>Value</th></tr>
          <tr><td>Passed</td><td>$(cat pw_passed.txt)</td></tr>
          <tr><td>Failed</td><td>$(cat pw_failed.txt)</td></tr>
          <tr><td>Duration</td><td>$(cat pw_duration.txt) sec</td></tr>
          </table>

          <h2>📎 Attachments</h2>
          <ac:structured-macro ac:name=\"attachments\">
            <ac:parameter ac:name=\"upload\">true</ac:parameter>
          </ac:structured-macro>
          "

          BODY=$(printf '%s' "$CONTENT" | awk '{printf "%s\\n",$0}')

          RESPONSE=$(curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
          -X POST \
          -H "Content-Type: application/json" \
          -d "{
            \"type\":\"page\",
            \"title\":\"Performance Report - $TS\",
            \"space\":{\"key\":\"${{ secrets.CONFLUENCE_SPACE_KEY }}\"},
            \"body\":{\"storage\":{\"value\":\"$BODY\",\"representation\":\"storage\"}}
          }" \
          "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/")

          PAGE_ID=$(echo "$RESPONSE" | jq -r '.id')

          echo "Uploading attachments..."

          curl -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@results.jtl" \
            -F "type=attachment" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$PAGE_ID/child/attachment"

          for f in pw-results/*.json; do
            if [ -f "$f" ]; then
              curl -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
                -X POST \
                -H "X-Atlassian-Token: no-check" \
                -F "file=@$f" \
                -F "type=attachment" \
                "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$PAGE_ID/child/attachment"
            fi
          done
