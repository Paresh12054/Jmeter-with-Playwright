name: JMeter + Playwright + Confluence

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      # -------------------------
      # Install JMeter
      # -------------------------
      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      # -------------------------
      # Start JMeter
      # -------------------------
      - name: Start JMeter
        run: |
          date +"%Y-%m-%d %H:%M:%S" > jm_start.txt
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      # -------------------------
      # Run Playwright
      # -------------------------
      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results
          date +"%Y-%m-%d %H:%M:%S" > pw_start.txt

          END=$((SECONDS+600))
          PASSED=0
          FAILED=0

          while [ $SECONDS -lt $END ]; do
            FILE="pw-results/result-$(date +%s).json"

            OUTPUT=$(npx playwright test tests/Demo1.spec.ts --reporter=json || true)
            echo "$OUTPUT" > "$FILE"

            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects? | select(.status?=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects? | select(.status?=="failed")] | length' "$FILE")

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            fi

            sleep 180
          done

          date +"%Y-%m-%d %H:%M:%S" > pw_end.txt
          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt

      # -------------------------
      # Stop JMeter
      # -------------------------
      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true
          date +"%Y-%m-%d %H:%M:%S" > jm_end.txt

      # -------------------------
      # Generate Report
      # -------------------------
      - name: Generate JMeter Report
        run: ./jmeter/bin/jmeter -g results.jtl -o jmeter-report

      # -------------------------
      # Aggregate Table
      # -------------------------
      - name: Generate Aggregate Table
        run: |
          echo "<table border='1'>" > agg.html
          echo "<tr><th>Txn</th><th>Total</th><th>Avg</th><th>P90</th><th>Error%</th><th>Status</th></tr>" >> agg.html

          awk -F',' '
          NR>1 {
            label=$3
            success=tolower($8)

            gsub(/\r/,"",success)
            gsub(/^[ \t"]+|[ \t"]+$/, "", success)

            total[label]++
            sum[label]+=$2

            if (success=="false" || success=="0") fail[label]++
          }
          END {
            for (l in total) {
              avg = int(sum[l]/total[l])
              err = (fail[l]/total[l])*100

              status = (avg < 1000 && err < 1) ? "PASS" : "FAIL"

              macro = (status=="PASS") ? "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro>" : "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro>"

              printf "<tr><td>%s</td><td>%d</td><td>%d</td><td>-</td><td>%.2f</td><td>%s</td></tr>\n", l,total[l],avg,err,macro
            }
          }' results.jtl >> agg.html

          echo "</table>" >> agg.html

      # -------------------------
      # Publish to Confluence
      # -------------------------
      - name: Publish to Confluence
        run: |
          CONTENT="<h1>🚀 Performance Report</h1>
          <h2>Timeline</h2>
          <p>JMeter: $(cat jm_start.txt) → $(cat jm_end.txt)</p>
          <p>Playwright: $(cat pw_start.txt) → $(cat pw_end.txt)</p>

          <h2>Results</h2>
          $(cat agg.html)

          <h2>Playwright</h2>
          <p>Passed: $(cat pw_passed.txt)</p>
          <p>Failed: $(cat pw_failed.txt)</p>

          <h2>Attachments</h2>
          <ac:structured-macro ac:name=\"attachments\"/>"

          JSON=$(jq -n \
            --arg title "Perf Report $(date +%s)" \
            --arg content "$CONTENT" \
            '{
              type:"page",
              title:$title,
              space:{key:env.CONFLUENCE_SPACE_KEY},
              body:{storage:{value:$content,representation:"storage"}}
            }')

          RESPONSE=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON" \
            "$CONFLUENCE_BASE_URL/rest/api/content")

          PAGE_ID=$(echo "$RESPONSE" | jq -r '.id')

          echo "Page ID: $PAGE_ID"

      # -------------------------
      # Attach Files (FIXED)
      # -------------------------
      - name: Upload Attachments
        run: |
          set -e

          echo "Uploading JTL..."
          curl -f -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@results.jtl" \
            "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"

          echo "Zipping report..."
          zip -r jmeter-report.zip jmeter-report

          echo "Uploading report zip..."
          curl -f -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@jmeter-report.zip" \
            "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"

          echo "Uploading Playwright files..."
          for f in pw-results/*.json; do
            curl -f -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
              -H "X-Atlassian-Token: no-check" \
              -F "file=@$f" \
              "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"
          done
