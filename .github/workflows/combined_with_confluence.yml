name: JMeter + Playwright + Confluence

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Install tools
      # -------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      # -------------------------
      # Install JMeter
      # -------------------------
      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      # -------------------------
      # Start JMeter
      # -------------------------
      - name: Start JMeter
        run: |
          date +"%Y-%m-%d %H:%M:%S" > jm_start.txt
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      # -------------------------
      # Run Playwright
      # -------------------------
      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results
          date +"%Y-%m-%d %H:%M:%S" > pw_start.txt

          END=$((SECONDS+600))
          PASSED=0
          FAILED=0

          while [ $SECONDS -lt $END ]; do
            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            FILE="pw-results/result-$TS.json"

            OUTPUT=$(npx playwright test tests/Demo1.spec.ts --reporter=json || true)
            echo "$OUTPUT" > "$FILE"

            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects? | select(.status?=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects? | select(.status?=="failed")] | length' "$FILE")

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            fi

            sleep 180
          done

          date +"%Y-%m-%d %H:%M:%S" > pw_end.txt
          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt

      # -------------------------
      # Stop JMeter
      # -------------------------
      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true
          date +"%Y-%m-%d %H:%M:%S" > jm_end.txt

      # -------------------------
      # Generate JMeter HTML Report
      # -------------------------
      - name: Generate JMeter HTML Report
        run: |
          ./jmeter/bin/jmeter -g results.jtl -o jmeter-report

      # -------------------------
      # Aggregate + SLA
      # -------------------------
      - name: Generate Aggregate Table
        run: |
          echo "<table border='1' style='border-collapse: collapse;'>" > agg.html

          echo "<tr>
          <th>Transaction</th>
          <th>Total</th>
          <th>Avg (ms)</th>
          <th>P90 (ms)</th>
          <th>P95 (ms)</th>
          <th>Error %</th>
          <th>Avg SLA</th>
          <th>P90 SLA</th>
          <th>Overall SLA</th>
          </tr>" >> agg.html

          awk -F',' '
          NR>1 {

            label=$3
            success=$8

            gsub(/\r/,"",success)
            gsub(/^[ \t"]+|[ \t"]+$/, "", success)

            if (label ~ /^PT[0-9]+_/) {

              total[label]++
              sum[label]+=$2

              if (success != "true") {
                fail[label]++
              }

              times[label]=times[label] " " $2
            }
          }
          END {
            for (l in total) {

              n=split(times[l], arr, " ")

              idx=0
              for(i=1;i<=n;i++){
                if(arr[i]!=""){
                  clean[++idx]=arr[i]
                }
              }
              n=idx

              for(i=1;i<=n;i++){
                for(j=i+1;j<=n;j++){
                  if(clean[i]>clean[j]){
                    tmp=clean[i]; clean[i]=clean[j]; clean[j]=tmp
                  }
                }
              }

              p90_index = int((n*90 + 99)/100)
              p95_index = int((n*95 + 99)/100)

              p90 = clean[p90_index]
              p95 = clean[p95_index]

              avg = int(sum[l]/total[l])

              err = 0
              if (total[l] > 0) {
                err = (fail[l]/total[l])*100
              }

              avg_sla = (avg <= 1000) ? "PASS" : "FAIL"
              p90_sla = (p90 <= 3000) ? "PASS" : "FAIL"
              overall = (avg_sla=="PASS" && p90_sla=="PASS") ? "PASS" : "FAIL"

              avg_color = (avg_sla=="PASS") ? "#c6efce" : "#ffc7ce"
              p90_color = (p90_sla=="PASS") ? "#c6efce" : "#ffc7ce"
              overall_color = (overall=="PASS") ? "#c6efce" : "#ffc7ce"

              printf "<tr>"
              printf "<td>%s</td>", l
              printf "<td>%d</td>", total[l]
              printf "<td>%d</td>", avg
              printf "<td>%d</td>", p90
              printf "<td>%d</td>", p95
              printf "<td>%.2f</td>", err
              printf "<td style=\"background-color:%s\"><b>%s</b></td>", avg_color, avg_sla
              printf "<td style=\"background-color:%s\"><b>%s</b></td>", p90_color, p90_sla
              printf "<td style=\"background-color:%s\"><b>%s</b></td>", overall_color, overall
              printf "</tr>\n"
            }
          }' results.jtl >> agg.html

          echo "</table>" >> agg.html

      # -------------------------
      # Publish to Confluence
      # -------------------------
      - name: Publish to Confluence
        run: |
          set -e

          TS=$(date +"%Y-%m-%d %H:%M:%S")
          AGG=$(cat agg.html)

          CONTENT="<h1>🚀 Performance & UI Test Report</h1>

          <h2>⏱ Execution Timeline</h2>
          <table border='1'>
          <tr><th>Type</th><th>Start</th><th>End</th></tr>
          <tr><td>JMeter</td><td>$(cat jm_start.txt)</td><td>$(cat jm_end.txt)</td></tr>
          <tr><td>Playwright</td><td>$(cat pw_start.txt)</td><td>$(cat pw_end.txt)</td></tr>
          </table>

          <h2>📈 Transaction-Level Aggregate (SLA Enabled)</h2>
          $AGG

          <h2>📊 JMeter HTML Report</h2>
          <p>Attached separately (zip file)</p>

          <h2>🎭 Playwright Summary</h2>
          <table border='1'>
          <tr><th>Passed</th><th>Failed</th></tr>
          <tr><td>$(cat pw_passed.txt)</td><td>$(cat pw_failed.txt)</td></tr>
          </table>

          <h2>📝 Observations</h2>
          <p><i>👉 Add your observations, bottlenecks, and recommendations here manually.</i></p>

          <h2>📎 Attachments</h2>
          <ac:structured-macro ac:name=\"attachments\"/>"

          # Proper XHTML escaping
          ESCAPED=$(printf '%s' "$CONTENT" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

          RESPONSE=$(curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{
              \"type\": \"page\",
              \"title\": \"Performance Report - $TS\",
              \"space\": {\"key\": \"${{ secrets.CONFLUENCE_SPACE_KEY }}\"},
              \"body\": {\"storage\": {\"value\": \"$ESCAPED\",\"representation\": \"storage\"}}
            }" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/")

          PAGE_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$PAGE_ID" == "null" ] || [ -z "$PAGE_ID" ]; then
            echo "Failed to create Confluence page"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Page ID: $PAGE_ID"

          # Attach JTL
          curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST -H "X-Atlassian-Token: no-check" \
            -F "file=@results.jtl;filename=jmeter-results.jtl" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$PAGE_ID/child/attachment"

          # Attach HTML report
          zip -r jmeter-report.zip jmeter-report

          curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST -H "X-Atlassian-Token: no-check" \
            -F "file=@jmeter-report.zip;filename=jmeter-report.zip" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$PAGE_ID/child/attachment"

          # Attach Playwright results
          for f in pw-results/*.json; do
            curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
              -X POST -H "X-Atlassian-Token: no-check" \
              -F "file=@$f" \
              "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$PAGE_ID/child/attachment"
          done
