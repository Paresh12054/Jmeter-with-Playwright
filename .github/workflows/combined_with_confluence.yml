name: JMeter + Playwright + Confluence Combined Pipeline with Confluence Report

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Install jq
      # -------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # -------------------------
      # Setup Node
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -------------------------
      # Install JMeter
      # -------------------------
      - name: Install JMeter
        run: |
          JMETER_VERSION=5.6.3
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz
          tar -xzf apache-jmeter-$JMETER_VERSION.tgz
          mv apache-jmeter-$JMETER_VERSION jmeter

      # -------------------------
      # Start JMeter
      # -------------------------
      - name: Start JMeter Test
        run: |
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      # -------------------------
      # Run Playwright periodically
      # -------------------------
      - name: Run Playwright periodically
        run: |
          END=$((SECONDS+600))
          PASSED=0
          FAILED=0

          START_TIME=$(date +%s)

          while [ $SECONDS -lt $END ]; do
            TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
            RESULT_FILE="pw-result-$TIMESTAMP.json"

            npx playwright test tests/Demo1.spec.ts --reporter=json > $RESULT_FILE || true

            if [ -f "$RESULT_FILE" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' $RESULT_FILE)
              F=$(jq '[.. | objects | select(.status=="failed")] | length' $RESULT_FILE)

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            fi

            sleep 180
          done

          END_TIME=$(date +%s)
          PW_DURATION=$((END_TIME - START_TIME))

          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt
          echo $PW_DURATION > pw_duration.txt

      # -------------------------
      # Stop JMeter
      # -------------------------
      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true

      # -------------------------
      # Generate JMeter Report
      # -------------------------
      - name: Generate JMeter HTML Report
        run: |
          ./jmeter/bin/jmeter -g results.jtl -o report

      # -------------------------
      # Extract JMeter Metrics
      # -------------------------
      - name: Extract JMeter Metrics
        run: |
          TOTAL=$(($(wc -l < results.jtl) - 1))
          FAILURES=$(awk -F',' 'NR>1 && $8 != "true" {count++} END {print count+0}' results.jtl)

          AVG_RESPONSE=$(awk -F',' 'NR>1 {sum+=$2; count++} END {print int(sum/count)}' results.jtl)

          P90=$(awk -F',' 'NR>1 {print $2}' results.jtl | sort -n | awk '{a[NR]=$1} END {print a[int(NR*0.9)]}')
          P95=$(awk -F',' 'NR>1 {print $2}' results.jtl | sort -n | awk '{a[NR]=$1} END {print a[int(NR*0.95)]}')

          USERS=$(awk -F',' 'NR>1 {if($13>max) max=$13} END {print max+0}' results.jtl)

          START=$(awk -F',' 'NR==2 {print $1}' results.jtl)
          END=$(awk -F',' 'END {print $1}' results.jtl)

          if [ -z "$START" ] || [ -z "$END" ]; then
            DURATION=0
          else
            DURATION=$(( (END - START) / 1000 ))
          fi

          if [ "$DURATION" -eq 0 ]; then DURATION=1; fi
          THROUGHPUT=$(awk "BEGIN {printf \"%.2f\", ($TOTAL/$DURATION)}")
          ERROR_PERCENT=$(awk "BEGIN {printf \"%.2f\", ($FAILURES/$TOTAL)*100}")

          echo $AVG_RESPONSE > avg_response.txt
          echo $ERROR_PERCENT > error_percent.txt
          echo $P90 > p90.txt
          echo $P95 > p95.txt
          echo $USERS > users.txt
          echo $DURATION > duration.txt
          echo $THROUGHPUT > throughput.txt
          echo $TOTAL > total.txt
          echo $FAILURES > failures.txt

      # -------------------------
      # Debug
      # -------------------------
      - name: Debug Files
        run: |
          echo "===== FILE CHECK ====="
          ls -l
          ls -l results.jtl || echo "Missing JTL"
          ls -l pw-result-*.json || echo "No PW files"

      # -------------------------
      # Publish to Confluence + Attachments
      # -------------------------
      - name: Publish Results to Confluence
        shell: bash
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")

          CONTENT="<h1>Performance Report</h1><p>$TIMESTAMP</p>"

          ESCAPED_CONTENT=$(printf '%s' "$CONTENT" | awk '{printf "%s\\n", $0}')

          RESPONSE=$(curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"page\",
              \"title\": \"Performance Report - $TIMESTAMP\",
              \"space\": {\"key\": \"${{ secrets.CONFLUENCE_SPACE_KEY }}\"},
              \"body\": {\"storage\": {\"value\": \"$ESCAPED_CONTENT\",\"representation\": \"storage\"}}
            }" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/")

          PAGE_ID=$(echo "$RESPONSE" | jq -r '.id')

          echo "Page ID: $PAGE_ID"

          echo "Uploading results.jtl..."
          curl -v -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@results.jtl" \
            -F "type=attachment" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/${PAGE_ID}/child/attachment"

          echo "Uploading Playwright files..."
          for file in pw-result-*.json; do
            if [ -f "$file" ]; then
              curl -v -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
                -X POST \
                -H "X-Atlassian-Token: no-check" \
                -F "file=@$file" \
                -F "type=attachment" \
                "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/${PAGE_ID}/child/attachment"
            fi
          done
