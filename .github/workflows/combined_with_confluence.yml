name: JMeter + Playwright + Confluence FINAL

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - uses: actions/checkout@v4

      # -------------------------
      # Install tools
      # -------------------------
      - run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      # -------------------------
      # Install JMeter
      # -------------------------
      - run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      # -------------------------
      # Start JMeter
      # -------------------------
      - run: |
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      # -------------------------
      # Run Playwright (FIXED PROPERLY)
      # -------------------------
      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results

          END=$((SECONDS+600))
          PASSED=0
          FAILED=0

          START_TIME=$(date +%s)

          while [ $SECONDS -lt $END ]; do
            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            OUT="pw-results/result-$TS.json"

            npx playwright test tests/Demo1.spec.ts \
              --reporter=json \
              --reporter-options outputFile=$OUT || true

            if [ -f "$OUT" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' "$OUT")
              F=$(jq '[.. | objects | select(.status=="failed")] | length' "$OUT")

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            else
              echo "⚠️ File not created: $OUT"
            fi

            sleep 180
          done

          END_TIME=$(date +%s)

          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt
          echo $((END_TIME - START_TIME)) > pw_duration.txt

      # -------------------------
      # Stop JMeter
      # -------------------------
      - run: kill $(cat jmeter.pid) || true

      # -------------------------
      # Extract JMeter Metrics
      # -------------------------
      - run: |
          TOTAL=$(($(wc -l < results.jtl) - 1))
          FAIL=$(awk -F',' 'NR>1 && $8!="true"{c++}END{print c+0}' results.jtl)

          AVG=$(awk -F',' 'NR>1{sum+=$2;c++}END{print int(sum/c)}' results.jtl)

          P90=$(awk -F',' 'NR>1{print $2}' results.jtl | sort -n | awk '{a[NR]=$1}END{print a[int(NR*0.9)]}')
          P95=$(awk -F',' 'NR>1{print $2}' results.jtl | sort -n | awk '{a[NR]=$1}END{print a[int(NR*0.95)]}')

          USERS=$(awk -F',' 'NR>1{if($13>m)m=$13}END{print m+0}' results.jtl)

          START=$(awk -F',' 'NR==2{print $1}' results.jtl)
          END=$(awk -F',' 'END{print $1}' results.jtl)

          DUR=$(( (END-START)/1000 ))
          [ "$DUR" -eq 0 ] && DUR=1

          THR=$(awk "BEGIN {printf \"%.2f\", ($TOTAL/$DUR)}")
          ERR=$(awk "BEGIN {printf \"%.2f\", ($FAIL/$TOTAL)*100}")

          echo $AVG > avg.txt
          echo $ERR > err.txt
          echo $P90 > p90.txt
          echo $P95 > p95.txt
          echo $USERS > users.txt
          echo $DUR > dur.txt
          echo $THR > thr.txt
          echo $TOTAL > total.txt
          echo $FAIL > fail.txt

      # -------------------------
      # Debug
      # -------------------------
      - run: |
          echo "===== DEBUG FILES ====="
          ls -R
          echo "======================="

      # -------------------------
      # Upload Artifacts (FIXED)
      # -------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results.jtl

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: pw-results

      # -------------------------
      # Publish to Confluence (FULL CONTENT)
      # -------------------------
      - name: Publish
        run: |
          TS=$(date +"%Y-%m-%d %H:%M:%S")

          CONTENT="<h1>Performance Report</h1>
          <p><b>Time:</b> $TS</p>
          <h2>JMeter</h2>
          <p>Avg: $(cat avg.txt) ms | P90: $(cat p90.txt) | P95: $(cat p95.txt)</p>
          <p>Error %: $(cat err.txt) | Throughput: $(cat thr.txt)</p>
          <p>Users: $(cat users.txt) | Duration: $(cat dur.txt)</p>

          <h2>Playwright</h2>
          <p>Passed: $(cat pw_passed.txt) | Failed: $(cat pw_failed.txt)</p>
          <p>Duration: $(cat pw_duration.txt)</p>"

          BODY=$(printf '%s' "$CONTENT" | awk '{printf "%s\\n",$0}')

          RES=$(curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
          -X POST \
          -H "Content-Type: application/json" \
          -d "{
            \"type\":\"page\",
            \"title\":\"Report - $TS\",
            \"space\":{\"key\":\"${{ secrets.CONFLUENCE_SPACE_KEY }}\"},
            \"body\":{\"storage\":{\"value\":\"$BODY\",\"representation\":\"storage\"}}
          }" \
          "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/")

          ID=$(echo "$RES" | jq -r '.id')

          echo "Uploading attachments..."

          curl -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@results.jtl" \
            -F "type=attachment" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$ID/child/attachment"

          for f in pw-results/*.json; do
            if [ -f "$f" ]; then
              curl -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
                -X POST \
                -H "X-Atlassian-Token: no-check" \
                -F "file=@$f" \
                -F "type=attachment" \
                "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$ID/child/attachment"
            fi
          done
