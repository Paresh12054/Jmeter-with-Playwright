name: Confluence Color Test

on:
  workflow_dispatch:

jobs:
  test-confluence-colors:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create Confluence Page with Status Macros
        run: |
          set -e

          CONTENT="<h1>🎨 Confluence Status Macro Test</h1>

          <table border='1' style='border-collapse: collapse; width:50%;'>
            <tr>
              <th>Status</th>
              <th>Result</th>
            </tr>
            <tr>
              <td>PASS</td>
              <td>
                <ac:structured-macro ac:name=\"status\">
                  <ac:parameter ac:name=\"colour\">Green</ac:parameter>
                  <ac:parameter ac:name=\"title\">PASS</ac:parameter>
                </ac:structured-macro>
              </td>
            </tr>
            <tr>
              <td>FAIL</td>
              <td>
                <ac:structured-macro ac:name=\"status\">
                  <ac:parameter ac:name=\"colour\">Red</ac:parameter>
                  <ac:parameter ac:name=\"title\">FAIL</ac:parameter>
                </ac:structured-macro>
              </td>
            </tr>
          </table>

          <p>If you see colored badges → ✅ SUCCESS</p>
          <p>This is the correct way to display status in Confluence</p>
          "

          JSON_BODY=$(jq -n \
            --arg title "Color Test - $(date +"%Y-%m-%d %H:%M:%S")" \
            --arg content "$CONTENT" \
            '{
              type: "page",
              title: $title,
              space: { key: env.CONFLUENCE_SPACE_KEY },
              body: {
                storage: {
                  value: $content,
                  representation: "storage"
                }
              }
            }')

          RESPONSE=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$JSON_BODY" \
            "$CONFLUENCE_BASE_URL/rest/api/content/")

          PAGE_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$PAGE_ID" == "null" ] || [ -z "$PAGE_ID" ]; then
            echo "❌ Failed to create page"
            echo "$RESPONSE"
            exit 1
          fi

          echo "✅ Page created successfully: $PAGE_ID"
