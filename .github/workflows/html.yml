name: Publish HTML Screenshot to Confluence

on:
  workflow_dispatch:

jobs:
  publish-report:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install Playwright
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      # Generate screenshot from HTML
      - name: Generate Screenshot
        run: |
          node <<EOF
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 900
              }
            });

            const htmlPath = 'file://' + path.resolve('reports/zap-report.html');

            await page.goto(htmlPath, {
              waitUntil: 'networkidle'
            });

            await page.screenshot({
              path: 'zap-report.png',
              fullPage: true
            });

            await browser.close();

            console.log('Screenshot created');
          })();
          EOF

      # Publish to Confluence
      - name: Publish Screenshot to Confluence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const FormData = require('form-data');

            const baseUrl = process.env.CONFLUENCE_BASE_URL;
            const email = process.env.CONFLUENCE_EMAIL;
            const token = process.env.CONFLUENCE_API_TOKEN;
            const spaceKey = process.env.CONFLUENCE_SPACE_KEY;

            const parentId = "18907150";

            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json"
            };

            const timestamp = new Date().toISOString();

            // Step 1: Create Confluence Page
            const pageData = {
              type: "page",
              title: `ZAP Security Report - ${timestamp}`,
              ancestors: [{ id: parentId }],
              space: {
                key: spaceKey
              },
              body: {
                storage: {
                  value: `
                    <h1>ZAP Security Report</h1>

                    <p>
                      Generated from GitHub Actions pipeline.
                    </p>

                    <p>
                      Screenshot will appear below after upload.
                    </p>
                  `,
                  representation: "storage"
                }
              }
            };

            const createPageResponse = await fetch(
              `${baseUrl}/rest/api/content`,
              {
                method: "POST",
                headers,
                body: JSON.stringify(pageData)
              }
            );

            if (!createPageResponse.ok) {
              throw new Error(await createPageResponse.text());
            }

            const pageResult = await createPageResponse.json();

            const pageId = pageResult.id;

            console.log(`Page created: ${pageId}`);

            // Step 2: Upload attachment
            const form = new FormData();

            form.append(
              "file",
              fs.createReadStream("zap-report.png")
            );

            const uploadResponse = await fetch(
              `${baseUrl}/rest/api/content/${pageId}/child/attachment`,
              {
                method: "POST",
                headers: {
                  "Authorization": `Basic ${auth}`,
                  "X-Atlassian-Token": "no-check",
                  ...form.getHeaders()
                },
                body: form
              }
            );

            if (!uploadResponse.ok) {
              throw new Error(await uploadResponse.text());
            }

            console.log("Attachment uploaded");

            // Step 3: Update page with embedded image
            const imageBody = `
              <h1>ZAP Security Report</h1>

              <p>
                Generated from GitHub Actions pipeline.
              </p>

              <ac:image ac:width="1400">
                <ri:attachment ri:filename="zap-report.png"/>
              </ac:image>
            `;

            const updatePayload = {
              id: pageId,
              type: "page",
              title: pageResult.title,
              version: {
                number: pageResult.version.number + 1
              },
              body: {
                storage: {
                  value: imageBody,
                  representation: "storage"
                }
              }
            };

            const updateResponse = await fetch(
              `${baseUrl}/rest/api/content/${pageId}`,
              {
                method: "PUT",
                headers,
                body: JSON.stringify(updatePayload)
              }
            );

            if (!updateResponse.ok) {
              throw new Error(await updateResponse.text());
            }

            console.log("Page updated with image");

            console.log(
              `${baseUrl}${pageResult._links.webui}`
            );
