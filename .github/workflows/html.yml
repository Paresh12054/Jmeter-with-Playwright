name: HTML Integration

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Publish to Confluence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const baseUrl = process.env.CONFLUENCE_BASE_URL;
            const email = process.env.CONFLUENCE_EMAIL;
            const token = process.env.CONFLUENCE_API_TOKEN;
            const spaceKey = process.env.CONFLUENCE_SPACE_KEY;

            const parentId = "18907150";

            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json"
            };

            // Validate report exists
            const reportPath = 'reports/zap-report.html';

            if (!fs.existsSync(reportPath)) {
              throw new Error(`Report file not found: ${reportPath}`);
            }

            // Read HTML report
            const htmlContent = fs.readFileSync(reportPath, 'utf8');

            // Escape CDATA termination if present
            const safeHtml = htmlContent.replace(/]]>/g, ']]]]><![CDATA[>');

            // Dynamic title
            const timestamp = new Date().toISOString();

            // Confluence page body
            const pageBody = `
            <ac:structured-macro ac:name="html">
              <ac:plain-text-body><![CDATA[
                ${safeHtml}
              ]]></ac:plain-text-body>
            </ac:structured-macro>
            `;

            const pageData = {
              type: "page",
              title: `ZAP Security Report - ${timestamp}`,
              ancestors: [{ id: parentId }],
              space: {
                key: spaceKey
              },
              body: {
                storage: {
                  value: pageBody,
                  representation: "storage"
                }
              }
            };

            const response = await fetch(
              `${baseUrl}/rest/api/content`,
              {
                method: "POST",
                headers,
                body: JSON.stringify(pageData)
              }
            );

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(
                `Confluence API failed: ${response.status} - ${errorText}`
              );
            }

            const result = await response.json();

            console.log("Confluence page created successfully");
            console.log(result._links.webui);
