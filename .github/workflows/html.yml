name: HTML Integration

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Publish HTML Report to Confluence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Environment variables
            const baseUrl = process.env.CONFLUENCE_BASE_URL;
            const email = process.env.CONFLUENCE_EMAIL;
            const token = process.env.CONFLUENCE_API_TOKEN;
            const spaceKey = process.env.CONFLUENCE_SPACE_KEY;

            // Parent page ID
            const parentId = "18907150";

            // Authentication
            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json"
            };

            // Report path
            const reportPath = 'reports/zap-report.html';

            // Validate report exists
            if (!fs.existsSync(reportPath)) {
              throw new Error(`Report file not found: ${reportPath}`);
            }

            console.log(`Reading report from: ${reportPath}`);

            // Read HTML report
            let htmlContent = fs.readFileSync(reportPath, 'utf8');

            // Remove unsupported HTML tags
            htmlContent = htmlContent
              .replace(/<!DOCTYPE[^>]*>/gi, '')
              .replace(/<html[^>]*>/gi, '')
              .replace(/<\/html>/gi, '')
              .replace(/<head[\s\S]*?<\/head>/gi, '')
              .replace(/<body[^>]*>/gi, '')
              .replace(/<\/body>/gi, '');

            // Generate timestamp
            const timestamp = new Date().toISOString();

            // Page title
            const pageTitle = `ZAP Security Report - ${timestamp}`;

            // Confluence page body
            const pageBody = `
              <h1>ZAP Security Report</h1>

              <p>
                <b>Generated:</b> ${timestamp}<br/>
                <b>Repository:</b> ${process.env.GITHUB_REPOSITORY}<br/>
                <b>Branch:</b> ${process.env.GITHUB_REF_NAME}<br/>
                <b>Workflow:</b> ${process.env.GITHUB_WORKFLOW}<br/>
                <b>Run Number:</b> ${process.env.GITHUB_RUN_NUMBER}
              </p>

              <hr/>

              ${htmlContent}
            `;

            // Confluence payload
            const pageData = {
              type: "page",
              title: pageTitle,
              ancestors: [{ id: parentId }],
              space: {
                key: spaceKey
              },
              body: {
                storage: {
                  value: pageBody,
                  representation: "storage"
                }
              }
            };

            console.log("Creating Confluence page...");

            // Create page
            const response = await fetch(
              `${baseUrl}/rest/api/content`,
              {
                method: "POST",
                headers,
                body: JSON.stringify(pageData)
              }
            );

            // Handle errors
            if (!response.ok) {
              const errorText = await response.text();

              console.log("Confluence API Error:");
              console.log(errorText);

              throw new Error(
                `Failed to create page: ${response.status}`
              );
            }

            // Parse response
            const result = await response.json();

            console.log("Confluence page created successfully");

            // Print page URL
            console.log(
              `${baseUrl}${result._links.webui}`
            );
