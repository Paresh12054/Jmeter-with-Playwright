name: JMeter + Confluence + SLA

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -------------------------
      # Install tools
      # -------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      # -------------------------
      # Install JMeter
      # -------------------------
      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      # -------------------------
      # Start JMeter
      # -------------------------
      - name: Start JMeter
        run: |
          JM_START=$(date +"%Y-%m-%d %H:%M:%S")
          echo $JM_START > jm_start.txt

          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      # -------------------------
      # Run Playwright
      # -------------------------
      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results

          PW_START=$(date +"%Y-%m-%d %H:%M:%S")
          echo $PW_START > pw_start.txt

          END=$((SECONDS+600))
          PASSED=0
          FAILED=0

          while [ $SECONDS -lt $END ]; do
            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            FILE="pw-results/result-$TS.json"

            OUTPUT=$(npx playwright test tests/Demo1.spec.ts --reporter=json || true)
            echo "$OUTPUT" > "$FILE"

            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects | select(.status=="failed")] | length' "$FILE")

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            fi

            sleep 180
          done

          PW_END=$(date +"%Y-%m-%d %H:%M:%S")
          echo $PW_END > pw_end.txt

          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt

      # -------------------------
      # Stop JMeter
      # -------------------------
      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true
          JM_END=$(date +"%Y-%m-%d %H:%M:%S")
          echo $JM_END > jm_end.txt

      # -------------------------
      # Generate JMeter HTML Report
      # -------------------------
      - name: Generate JMeter HTML Report
        run: |
          ./jmeter/bin/jmeter -g results.jtl -o jmeter-report

      # -------------------------
      # Extract Metrics + SLA + Aggregate
      # -------------------------
      - name: Extract Metrics + Aggregate
        run: |
          echo "<table border='1' style='border-collapse: collapse;'>" > agg.html

          echo "<tr>
          <th>Transaction</th>
          <th>Total</th>
          <th>Avg (ms)</th>
          <th>P90 (ms)</th>
          <th>P95 (ms)</th>
          <th>Error %</th>
          <th>Avg SLA (≤1000ms)</th>
          <th>P90 SLA (≤3000ms)</th>
          <th>Overall SLA</th>
          </tr>" >> agg.html

          awk -F',' '
          NR>1 {
            label=$3
            success=$8

            if (label ~ /^PT[0-9]+_/) {

              total[label]++
              sum[label]+=$2

              if(success!="true") fail[label]++

              times[label]=times[label] " " $2
            }
          }
          END {
            for (l in total) {
              n=split(times[l], arr, " ")

              # sort array
              for(i=1;i<=n;i++){
                for(j=i+1;j<=n;j++){
                  if(arr[i]>arr[j]){
                    tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp
                  }
                }
              }

              p90=arr[int(n*0.9)]
              p95=arr[int(n*0.95)]
              avg=int(sum[l]/total[l])
              err=(fail[l]/total[l])*100

              avg_sla = (avg <= 1000) ? "PASS" : "FAIL"
              p90_sla = (p90 <= 3000) ? "PASS" : "FAIL"

              if (avg_sla=="PASS" && p90_sla=="PASS") {
                overall="PASS"
                color="#c6efce"   # green
              } else {
                overall="FAIL"
                color="#ffc7ce"   # red
              }

              printf "<tr style='background-color:%s'>
                <td>%s</td>
                <td>%d</td>
                <td>%d</td>
                <td>%d</td>
                <td>%d</td>
                <td>%.2f</td>
                <td>%s</td>
                <td>%s</td>
                <td><b>%s</b></td>
                </tr>\n",
              color,l,total[l],avg,p90,p95,err,avg_sla,p90_sla,overall
            }
          }' results.jtl >> agg.html

          echo "</table>" >> agg.html

      # -------------------------
      # Publish to Confluence
      # -------------------------
      - name: Publish to Confluence
        run: |
          set -e

          TS=$(date +"%Y-%m-%d %H:%M:%S")

          AGG=$(cat agg.html)

          CONTENT="<h1>🚀 Performance & UI Test Report</h1>

          <h2>⏱ Execution Timeline</h2>
          <table border='1'>
          <tr><th>Type</th><th>Start</th><th>End</th></tr>
          <tr><td>JMeter</td><td>$(cat jm_start.txt)</td><td>$(cat jm_end.txt)</td></tr>
          <tr><td>Playwright</td><td>$(cat pw_start.txt)</td><td>$(cat pw_end.txt)</td></tr>
          </table>

          <h2>📈 Transaction-Level Aggregate (SLA Enabled)</h2>
          $AGG

          <h2>📊 JMeter HTML Report</h2>
          <p>Download full report from attachments (jmeter-report.zip)</p>

          <h2>🎭 Playwright Summary</h2>
          <table border='1'>
          <tr><th>Passed</th><th>Failed</th></tr>
          <tr><td>$(cat pw_passed.txt)</td><td>$(cat pw_failed.txt)</td></tr>
          </table>

          <h2>📝 Observations</h2>
          <p><i>👉 Add your observations, bottlenecks, performance issues, and recommendations here manually.</i></p>

          <h2>📎 Attachments</h2>
          <ac:structured-macro ac:name=\"attachments\"/>"

          ESCAPED_CONTENT=$(printf '%s' "$CONTENT" | sed ':a;N;$!ba;s/\n/ /g' | sed 's/"/\\"/g')

          RESPONSE=$(curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"page\",
              \"title\": \"Performance Report - $TS\",
              \"space\": {\"key\": \"${{ secrets.CONFLUENCE_SPACE_KEY }}\"},
              \"body\": {\"storage\": {\"value\": \"$ESCAPED_CONTENT\",\"representation\": \"storage\"}}
            }" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/")

          PAGE_ID=$(echo "$RESPONSE" | jq -r '.id')

          echo "Page ID: $PAGE_ID"

          # Attach JMeter raw
          curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST -H "X-Atlassian-Token: no-check" \
            -F "file=@results.jtl" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$PAGE_ID/child/attachment"

          # Attach HTML report
          zip -r jmeter-report.zip jmeter-report

          curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
            -X POST -H "X-Atlassian-Token: no-check" \
            -F "file=@jmeter-report.zip" \
            "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$PAGE_ID/child/attachment"

          # Attach Playwright results
          for f in pw-results/*.json; do
            curl -s -u "${{ secrets.CONFLUENCE_EMAIL }}:${{ secrets.CONFLUENCE_API_TOKEN }}" \
              -X POST -H "X-Atlassian-Token: no-check" \
              -F "file=@$f" \
              "${{ secrets.CONFLUENCE_BASE_URL }}/rest/api/content/$PAGE_ID/child/attachment"
          done
