name: Test1

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      - name: Load SLA Config
        run: |
          echo "SLA_AVG=$(jq '.avg_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_P90=$(jq '.p90_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_ERR=$(jq '.error_percent' config/sla.json)" >> $GITHUB_ENV

      - name: Start JMeter
        run: |
          date +"%Y-%m-%d %H:%M:%S" > jm_start.txt
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results
          date +"%Y-%m-%d %H:%M:%S" > pw_start.txt

          END=$((SECONDS+600))
          PASSED=0
          FAILED=0

          RUN_INDEX=1
          RUN_SUMMARY_FILE=pw_runs_summary.txt
          echo "Run,Start,End,Duration(sec),Passed,Failed" > $RUN_SUMMARY_FILE

          while [ $SECONDS -lt $END ]; do
            TS_START=$(date +"%Y-%m-%d %H:%M:%S")
            START_SEC=$(date +%s)

            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            FILE="pw-results/result-$TS.json"

            OUTPUT=$(npx playwright test tests/Demo1.spec.ts --reporter=json || true)
            echo "$OUTPUT" > "$FILE"

            END_SEC=$(date +%s)
            TS_END=$(date +"%Y-%m-%d %H:%M:%S")

            DURATION=$((END_SEC - START_SEC))

            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects | select(.status=="failed")] | length' "$FILE")

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            else
              P=0
              F=0
            fi

            echo "$RUN_INDEX,$TS_START,$TS_END,$DURATION,$P,$F" >> $RUN_SUMMARY_FILE

            RUN_INDEX=$((RUN_INDEX+1))
            sleep 180
          done

          date +"%Y-%m-%d %H:%M:%S" > pw_end.txt
          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt

      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true
          date +"%Y-%m-%d %H:%M:%S" > jm_end.txt

      - name: Generate JMeter HTML Report
        run: |
          ./jmeter/bin/jmeter -g results.jtl -o jmeter-report

      # 🔐 -------------------------
      # SECURITY SCANS
      # -------------------------
      - name: Run npm audit
        run: |
          npm audit --audit-level=high > npm-audit.txt || true

      - name: Run Gitleaks Scan
        run: |
          docker run --rm -v $(pwd):/repo zricethezav/gitleaks detect --source=/repo > gitleaks.txt || true

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run -t owasp/zap2docker-stable zap-baseline.py \
            -t https://your-app-url.com \
            -r zap-report.html \
            -I || true

      # 🔐 SECURITY SUMMARY
      - name: Generate Security Summary
        run: |
          HIGH=$(grep -i "high" npm-audit.txt | wc -l || true)
          SECRETS=$(grep -i "leak" gitleaks.txt | wc -l || true)
          ZAP_FAIL=$(grep -i "FAIL-NEW" zap-report.html | wc -l || true)

          echo "<table border='1'>
          <tr><th>Check</th><th>Status</th></tr>" > security.html

          if [ "$HIGH" -gt 0 ]; then
            echo "<tr><td>Dependencies</td><td><ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro></td></tr>" >> security.html
          else
            echo "<tr><td>Dependencies</td><td><ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro></td></tr>" >> security.html
          fi

          if [ "$SECRETS" -gt 0 ]; then
            echo "<tr><td>Secrets</td><td><ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro></td></tr>" >> security.html
          else
            echo "<tr><td>Secrets</td><td><ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro></td></tr>" >> security.html
          fi

          if [ "$ZAP_FAIL" -gt 0 ]; then
            echo "<tr><td>Runtime (ZAP)</td><td><ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro></td></tr>" >> security.html
          else
            echo "<tr><td>Runtime (ZAP)</td><td><ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro></td></tr>" >> security.html
          fi

          echo "</table>" >> security.html

      # -------------------------
      # PUBLISH TO CONFLUENCE
      # -------------------------
      - name: Publish to Confluence
        run: |
          CONTENT="<h1>🚀 Performance & UI Test Report</h1>

          <h2>⏱ Execution Timeline</h2>
          <table border='1'>
          <tr><th>Type</th><th>Start</th><th>End</th></tr>
          <tr><td>JMeter</td><td>$(cat jm_start.txt)</td><td>$(cat jm_end.txt)</td></tr>
          <tr><td>Playwright</td><td>$(cat pw_start.txt)</td><td>$(cat pw_end.txt)</td></tr>
          </table>

          <h2>📈 Transaction-Level Aggregate</h2>
          $(cat agg.html)

          <h2>🔐 Security Summary</h2>
          $(cat security.html)

          <h2>📎 Attachments</h2>
          <ac:structured-macro ac:name=\"attachments\"/>"

          JSON=$(jq -n --arg title "Performance Report" --arg content "$CONTENT" '{
            type: "page",
            title: $title,
            space: { key: env.CONFLUENCE_SPACE_KEY },
            body: { storage: { value: $content, representation: "storage" } }
          }')

          RESPONSE=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -X POST -H "Content-Type: application/json" -d "$JSON" "$CONFLUENCE_BASE_URL/rest/api/content")
          PAGE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "PAGE_ID=$PAGE_ID"

      - name: Upload Attachments
        run: |
          curl -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -X POST -H "X-Atlassian-Token: no-check" -F "file=@results.jtl" "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"

          zip -r jmeter-report.zip jmeter-report

          curl -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -X POST -H "X-Atlassian-Token: no-check" -F "file=@jmeter-report.zip" "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"

          curl -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -X POST -H "X-Atlassian-Token: no-check" -F "file=@zap-report.html" "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"
