name: Test1

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      # -------------------------
      # Load SLA Config
      # -------------------------
      - name: Load SLA Config
        run: |
          echo "SLA_AVG=$(jq '.avg_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_P90=$(jq '.p90_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_ERR=$(jq '.error_percent' config/sla.json)" >> $GITHUB_ENV

      # -------------------------
      # Start JMeter
      # -------------------------
      - name: Start JMeter
        run: |
          date +"%Y-%m-%d %H:%M:%S" > jm_start.txt
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      # -------------------------
      # Run Playwright (4 runs tracked)
      # -------------------------
      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results
          date +"%Y-%m-%d %H:%M:%S" > pw_start.txt

          END=$((SECONDS+600))

          PASSED=0
          FAILED=0

          RUN_INDEX=1
          RUN_SUMMARY_FILE=pw_runs_summary.txt
          echo "Run,Start,End,Duration(sec),Passed,Failed" > $RUN_SUMMARY_FILE

          while [ $SECONDS -lt $END ]; do
            echo "Running Playwright iteration $RUN_INDEX..."

            TS_START=$(date +"%Y-%m-%d %H:%M:%S")
            START_SEC=$(date +%s)

            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            FILE="pw-results/result-$TS.json"

            OUTPUT=$(npx playwright test tests/Demo1.spec.ts --reporter=json || true)
            echo "$OUTPUT" > "$FILE"

            END_SEC=$(date +%s)
            TS_END=$(date +"%Y-%m-%d %H:%M:%S")

            DURATION=$((END_SEC - START_SEC))

            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects | select(.status=="failed")] | length' "$FILE")

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            else
              P=0
              F=0
            fi

            echo "$RUN_INDEX,$TS_START,$TS_END,$DURATION,$P,$F" >> $RUN_SUMMARY_FILE

            RUN_INDEX=$((RUN_INDEX+1))

            sleep 180
          done

          date +"%Y-%m-%d %H:%M:%S" > pw_end.txt
          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt

      # -------------------------
      # Stop JMeter
      # -------------------------
      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true
          date +"%Y-%m-%d %H:%M:%S" > jm_end.txt

      # -------------------------
      # Generate JMeter HTML Report
      # -------------------------
      - name: Generate JMeter HTML Report
        run: |
          ./jmeter/bin/jmeter -g results.jtl -o jmeter-report

      # -------------------------
      # Generate Response Time Graph (ADDED)
      # -------------------------
      - name: Generate JMeter Response Time Graph
        run: |
          pip install matplotlib pandas

          python << 'EOF'
          import pandas as pd
          import matplotlib.pyplot as plt

          df = pd.read_csv("results.jtl")
          df['timeStamp'] = pd.to_datetime(df['timeStamp'], unit='ms')
          df = df.sort_values('timeStamp')

          plt.figure()
          plt.plot(df['timeStamp'], df['elapsed'])
          plt.xlabel("Time")
          plt.ylabel("Response Time (ms)")
          plt.title("JMeter Response Time Over Time")
          plt.xticks(rotation=45)

          plt.tight_layout()
          plt.savefig("response_time.png")
          EOF

      # -------------------------
      # Aggregate Table (SLA dynamic)
      # -------------------------
      - name: Generate Aggregate Table
        run: |
          echo "<table border='1' style='border-collapse: collapse;'>" > agg.html

          echo "<tr>
          <th>Transaction</th>
          <th>Total</th>
          <th>Avg (ms)</th>
          <th>P90 (ms)</th>
          <th>P95 (ms)</th>
          <th>Error %</th>
          <th>Avg SLA</th>
          <th>P90 SLA</th>
          <th>Overall SLA</th>
          </tr>" >> agg.html

          awk -v sla_avg="$SLA_AVG" -v sla_p90="$SLA_P90" -F',' '
          NR>1 {
            label=$3
            success=tolower($8)

            gsub(/\r/,"",success)
            gsub(/^[ \t"]+|[ \t"]+$/, "", success)

            if (label ~ /^PT[0-9]+_/) {
              total[label]++
              sum[label]+=$2

              if (success == "false" || success == "0") fail[label]++

              times[label]=times[label] " " $2
            }
          }
          END {
            for (l in total) {

              n=split(times[l], arr, " ")

              idx=0
              for(i=1;i<=n;i++){
                if(arr[i]!="") clean[++idx]=arr[i]
              }
              n=idx

              for(i=1;i<=n;i++){
                for(j=i+1;j<=n;j++){
                  if(clean[i]>clean[j]){
                    tmp=clean[i]; clean[i]=clean[j]; clean[j]=tmp
                  }
                }
              }

              p90_index = int((n*90 + 99)/100)
              p95_index = int((n*95 + 99)/100)

              p90 = clean[p90_index]
              p95 = clean[p95_index]

              avg = int(sum[l]/total[l])
              err = (total[l] > 0) ? (fail[l]/total[l])*100 : 0

              avg_sla = (avg <= sla_avg) ? "PASS" : "FAIL"
              p90_sla = (p90 <= sla_p90) ? "PASS" : "FAIL"
              overall = (avg_sla=="PASS" && p90_sla=="PASS") ? "PASS" : "FAIL"

              printf "<tr>"
              printf "<td>%s</td>", l
              printf "<td>%d</td>", total[l]
              printf "<td>%d</td>", avg
              printf "<td>%d</td>", p90
              printf "<td>%d</td>", p95
              printf "<td>%.2f</td>", err
              printf "<td>%s</td>", (avg_sla=="PASS") ? "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro>" : "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro>"
              printf "<td>%s</td>", (p90_sla=="PASS") ? "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro>" : "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro>"
              printf "<td>%s</td>", (overall=="PASS") ? "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Green</ac:parameter><ac:parameter ac:name=\"title\">PASS</ac:parameter></ac:structured-macro>" : "<ac:structured-macro ac:name=\"status\"><ac:parameter ac:name=\"colour\">Red</ac:parameter><ac:parameter ac:name=\"title\">FAIL</ac:parameter></ac:structured-macro>"
              printf "</tr>\n"
            }
          }' results.jtl >> agg.html

          echo "</table>" >> agg.html

      # -------------------------
      # Publish to Confluence
      # -------------------------
      - name: Publish to Confluence
        run: |
          CONTENT="<h1>🚀 Performance & UI Test Report</h1>

          <h2>📏 SLA Configuration</h2>
          <table border='1'>
          <tr><th>Metric</th><th>Threshold</th></tr>
          <tr><td>Avg (ms)</td><td>$SLA_AVG</td></tr>
          <tr><td>P90 (ms)</td><td>$SLA_P90</td></tr>
          <tr><td>Error %</td><td>$SLA_ERR</td></tr>
          </table>

          <h2>⏱ Execution Timeline</h2>
          <table border='1'>
          <tr><th>Type</th><th>Start</th><th>End</th></tr>
          <tr>
            <td>JMeter</td>
            <td>$(cat jm_start.txt)</td>
            <td>$(cat jm_end.txt)</td>
          </tr>
          <tr>
            <td>Playwright</td>
            <td>$(cat pw_start.txt)</td>
            <td>$(cat pw_end.txt)</td>
          </tr>
          </table>

          <h2>📈 Transaction-Level Aggregate</h2>
          $(cat agg.html)

          <h2>🎭 Playwright Summary (All Runs)</h2>
          <table border='1'>
          <tr>
            <th>Run</th>
            <th>Start</th>
            <th>End</th>
            <th>Duration (sec)</th>
            <th>Passed</th>
            <th>Failed</th>
          </tr>

          $(tail -n +2 pw_runs_summary.txt | awk -F',' '{
            printf "<tr>"
            printf "<td>%s</td>", $1
            printf "<td>%s</td>", $2
            printf "<td>%s</td>", $3
            printf "<td>%s</td>", $4
            printf "<td>%s</td>", $5
            printf "<td>%s</td>", $6
            printf "</tr>\n"
          }')

          </table>

          <h2>📉 JMeter Response Time Graph</h2>
          <p>
            <ac:image>
              <ri:attachment ri:filename="response_time.png"/>
            </ac:image>
          </p>

          <h2>📊 JMeter HTML Report</h2>
          <p>Attached separately (zip file)</p>

          <h2>📝 Observations</h2>
          <p><i>Add observations, bottlenecks, and recommendations here.</i></p>

          <h2>📎 Attachments</h2>
          <ac:structured-macro ac:name=\"attachments\"/>"

          JSON=$(jq -n \
          --arg title "Performance Report - $(date +"%Y-%m-%d %H:%M:%S")" \
          --arg content "$CONTENT" \
          '{
            type: "page",
            title: $title,
            space: { key: env.CONFLUENCE_SPACE_KEY },
            body: {
              storage: {
                value: $content,
                representation: "storage"
              }
            }
          }')

          RESPONSE=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
          -X POST \
          -H "Content-Type: application/json" \
          -d "$JSON" \
          "$CONFLUENCE_BASE_URL/rest/api/content")

          PAGE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "PAGE_ID=$PAGE_ID" >> $GITHUB_ENV

      # -------------------------
      # Upload Attachments
      # -------------------------
      - name: Upload Attachments
        run: |
          curl -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -X POST -H "X-Atlassian-Token: no-check" \
            -F "file=@results.jtl" \
            "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"

          zip -r jmeter-report.zip jmeter-report

          curl -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -X POST -H "X-Atlassian-Token: no-check" \
            -F "file=@jmeter-report.zip" \
            "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"

          curl -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -X POST -H "X-Atlassian-Token: no-check" \
            -F "file=@response_time.png" \
            "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"

          for f in pw-results/*.json; do
            curl -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
              -X POST -H "X-Atlassian-Token: no-check" \
              -F "file=@$f" \
              "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"
          done
