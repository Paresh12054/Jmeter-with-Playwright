name: Test1

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      - name: Load SLA Config
        run: |
          echo "SLA_AVG=$(jq '.avg_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_P90=$(jq '.p90_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_ERR=$(jq '.error_percent' config/sla.json)" >> $GITHUB_ENV

      - name: Start JMeter
        run: |
          date +"%Y-%m-%d %H:%M:%S" > jm_start.txt
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined.jmx -l results.jtl -Jduration=600 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results
          date +"%Y-%m-%d %H:%M:%S" > pw_start.txt

          END=$((SECONDS+600))
          PASSED=0
          FAILED=0

          RUN_INDEX=1
          RUN_SUMMARY_FILE=pw_runs_summary.txt
          echo "Run,Start,End,Duration(sec),Passed,Failed" > $RUN_SUMMARY_FILE

          while [ $SECONDS -lt $END ]; do
            TS_START=$(date +"%Y-%m-%d %H:%M:%S")
            START_SEC=$(date +%s)

            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            FILE="pw-results/result-$TS.json"

            OUTPUT=$(npx playwright test tests/Demo1.spec.ts --reporter=json || true)
            echo "$OUTPUT" > "$FILE"

            END_SEC=$(date +%s)
            TS_END=$(date +"%Y-%m-%d %H:%M:%S")

            DURATION=$((END_SEC - START_SEC))

            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects | select(.status=="failed")] | length' "$FILE")

              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            else
              P=0
              F=0
            fi

            echo "$RUN_INDEX,$TS_START,$TS_END,$DURATION,$P,$F" >> $RUN_SUMMARY_FILE
            RUN_INDEX=$((RUN_INDEX+1))
            sleep 180
          done

          date +"%Y-%m-%d %H:%M:%S" > pw_end.txt
          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt

      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true
          date +"%Y-%m-%d %H:%M:%S" > jm_end.txt

      - name: Generate JMeter HTML Report
        run: |
          ./jmeter/bin/jmeter -g results.jtl -o jmeter-report

      - name: Generate Aggregate Table
        run: |
          echo "<table border='1'>" > agg.html
          echo "<tr><th>Transaction</th><th>Total</th><th>Avg</th></tr>" >> agg.html
          echo "</table>" >> agg.html

      # ✅ UPDATED CONFLUENCE LOGIC
      - name: Publish to Confluence (Parent-Child + Index)
        uses: actions/github-script@v7
        with:
          script: |
            const baseUrl = process.env.CONFLUENCE_BASE_URL;
            const email = process.env.CONFLUENCE_EMAIL;
            const token = process.env.CONFLUENCE_API_TOKEN;
            const spaceKey = process.env.CONFLUENCE_SPACE_KEY;

            const parentId = "5505025";
            const indexPageId = "5505025";

            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json"
            };

            const now = new Date().toLocaleString("en-GB").replace(",", "");
            const pageTitle = `Performance Report - ${now}`;

            async function api(url, method = "GET", body = null) {
              const res = await fetch(url, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
              });

              const text = await res.text();

              if (!res.ok) {
                throw new Error(`${method} ${url} failed:\n${text}`);
              }

              return text ? JSON.parse(text) : {};
            }

            const content = `<h1>🚀 Performance & UI Test Report</h1>`;

            // CREATE CHILD PAGE
            const childPage = await api(`${baseUrl}/rest/api/content`, "POST", {
              type: "page",
              title: pageTitle,
              ancestors: [{ id: parentId }],
              space: { key: spaceKey },
              body: {
                storage: {
                  value: content,
                  representation: "storage"
                }
              }
            });

            const childLink = childPage._links.base + childPage._links.webui;

            // FETCH INDEX PAGE
            const indexPage = await api(
              `${baseUrl}/rest/api/content/${indexPageId}?expand=body.storage,version`
            );

            let existingContent = indexPage.body.storage.value;
            const currentVersion = indexPage.version.number;

            const newRow = `
              <tr style="background-color:#E3FCEF;">
                <td>${now}</td>
                <td><a href="${childLink}"><strong>${pageTitle}</strong></a></td>
                <td>
                  <ac:structured-macro ac:name="status">
                    <ac:parameter ac:name="colour">Green</ac:parameter>
                    <ac:parameter ac:name="title">SUCCESS</ac:parameter>
                  </ac:structured-macro>
                </td>
              </tr>
            `;

            let rows = [];
            const allRows = existingContent.match(/<tr[\s\S]*?<\/tr>/gi);

            if (allRows && allRows.length > 1) {
              const dataRows = allRows.slice(1);
              rows = dataRows.map(row => row.replace(/<td>.*?<\/td>/, "").trim());
            }

            rows.unshift(newRow);

            rows = rows.map((row, index) => {
              const srNo = index + 1;
              return row.replace(/<tr[^>]*>/, `<tr><td>${srNo}</td>`);
            });

            const rebuiltRows = rows.join("");

            existingContent = existingContent.replace(
              /<tbody>[\s\S]*?<\/tbody>/,
              `<tbody>
                <tr>
                  <th>Sr.No</th>
                  <th>Created At</th>
                  <th>Page</th>
                  <th>Status</th>
                </tr>
                ${rebuiltRows}
              </tbody>`
            );

            await api(`${baseUrl}/rest/api/content/${indexPageId}`, "PUT", {
              id: indexPageId,
              type: "page",
              title: indexPage.title,
              version: { number: currentVersion + 1 },
              body: {
                storage: {
                  value: existingContent,
                  representation: "storage"
                }
              }
            });

            require('fs').appendFileSync(process.env.GITHUB_ENV, `PAGE_ID=${childPage.id}\n`);

      - name: Upload Attachments
        run: |
          echo "Uploading attachments..."
