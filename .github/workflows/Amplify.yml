name: Amplify Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-amplify:
    runs-on: ubuntu-latest

    env:
      AMPLIFY_TOKEN: ${{ secrets.AMPLIFY_TOKEN }}
      AMPLIFY_BASE_URL: https://amplify.planittesting.com

    steps:
      - name: Test Amplify API Connection
        run: |
          echo "Testing Amplify connectivity..."

          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "${AMPLIFY_BASE_URL}/external/api/completion_prompt" \
            -H "Authorization: Bearer $(echo -n $AMPLIFY_TOKEN)" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt_id": "232e0124-928b-48d4-b06d-1be47fec90fc",
              "messages": [
                {
                  "role": "user",
                  "content": "Connectivity test from GitHub Actions"
                }
                ]
                }')
          echo "Token length: ${#AMPLIFY_TOKEN}"
          echo "HTTP Status: $STATUS"
          echo "Response:"
          cat response.txt

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ]; then
            echo "✅ Amplify endpoint is reachable"
          else
            echo "❌ Amplify connectivity failed (Status: $STATUS)"
            exit 1
          fi
