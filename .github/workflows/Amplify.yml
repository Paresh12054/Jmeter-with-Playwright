name: Amplify Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-amplify:
    runs-on: ubuntu-latest

    env:
      AMPLIFY_API_KEY: ${{ secrets.AMPLIFY_API_KEY }}
      AMPLIFY_BASE_URL: https://amplify.planittesting.com

    steps:
      - name: Validate Amplify API Connectivity
        run: |
          echo "Checking Amplify endpoint availability..."

          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
          -X POST "${AMPLIFY_BASE_URL}/external/api/completion_prompt" \
          -H "x-api-key: ${AMPLIFY_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{}')

          echo "HTTP Status: $STATUS"
          echo "Response:"
            cat response.txt

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ]; then
          echo "✅ Amplify endpoint is reachable"
          else
          echo "❌ Amplify connectivity failed"
          exit 1
          fi
