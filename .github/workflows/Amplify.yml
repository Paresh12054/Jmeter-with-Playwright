name: Amplify Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-amplify:
    runs-on: ubuntu-latest

    env:
      AMPLIFY_API_KEY: ${{ secrets.AMPLIFY_API_KEY }}
      AMPLIFY_BASE_URL: https://amplify.planittesting.com/

    steps:
      - name: Test Amplify API Connection
        run: |
          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" \
          -X GET "$AMPLIFY_BASE_URL" \
          -H "Authorization: ApiKey $AMPLIFY_API_KEY"

          echo "HTTP Status: $RESPONSE"
          cat response.txt

          [ "$RESPONSE" -eq 200 ] && echo "SUCCESS" || exit 1
