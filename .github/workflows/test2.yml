name: Test2

on:
  workflow_dispatch:

jobs:
  performance-and-ui:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      - name: Load SLA Config
        run: |
          echo "SLA_AVG=$(jq '.avg_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_P90=$(jq '.p90_ms' config/sla.json)" >> $GITHUB_ENV
          echo "SLA_ERR=$(jq '.error_percent' config/sla.json)" >> $GITHUB_ENV

      - name: Start JMeter
        run: |
          date +"%Y-%m-%d %H:%M:%S" > jm_start.txt
          nohup ./jmeter/bin/jmeter -n -t scripts/GithubTest_combined1.jmx -l results.jtl -Jduration=180 > jmeter.log 2>&1 &
          echo $! > jmeter.pid

      - name: Run Playwright periodically
        run: |
          mkdir -p pw-results
          date +"%Y-%m-%d %H:%M:%S" > pw_start.txt

          END=$((SECONDS+180))
          PASSED=0
          FAILED=0

          RUN_INDEX=1
          RUN_SUMMARY_FILE=pw_runs_summary.txt
          echo "Run,Start,End,Duration(sec),Passed,Failed" > $RUN_SUMMARY_FILE

          while [ $SECONDS -lt $END ]; do
            TS_START=$(date +"%Y-%m-%d %H:%M:%S")
            START_SEC=$(date +%s)

            TS=$(date +"%Y-%m-%d_%H-%M-%S")
            FILE="pw-results/result-$TS.json"

            OUTPUT=$(npx playwright test tests/Demo1.spec.ts --reporter=json || true)
            echo "$OUTPUT" > "$FILE"

            END_SEC=$(date +%s)
            TS_END=$(date +"%Y-%m-%d %H:%M:%S")

            DURATION=$((END_SEC - START_SEC))

            if [ -s "$FILE" ]; then
              P=$(jq '[.. | objects | select(.status=="passed")] | length' "$FILE")
              F=$(jq '[.. | objects | select(.status=="failed")] | length' "$FILE")
              PASSED=$((PASSED + P))
              FAILED=$((FAILED + F))
            else
              P=0
              F=0
            fi

            echo "$RUN_INDEX,$TS_START,$TS_END,$DURATION,$P,$F" >> $RUN_SUMMARY_FILE
            RUN_INDEX=$((RUN_INDEX+1))
            sleep 90
          done

          date +"%Y-%m-%d %H:%M:%S" > pw_end.txt
          echo $PASSED > pw_passed.txt
          echo $FAILED > pw_failed.txt

      - name: Stop JMeter
        run: |
          kill $(cat jmeter.pid) || true
          date +"%Y-%m-%d %H:%M:%S" > jm_end.txt

      - name: Generate JMeter HTML Report
        run: |
          ./jmeter/bin/jmeter -g results.jtl -o jmeter-report

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://owasp.org/www-project-juice-shop/ \
            -r zap-report.html \
            -J zap-report.json \
            -I || true
          ls -l zap-report.*

      - name: Generate ZAP Summary
        run: |
          if [ -f zap-report.json ]; then
            FAIL=$(jq '.site[].alerts[] | select(.riskcode=="3")' zap-report.json | wc -l)
            WARN=$(jq '.site[].alerts[] | select(.riskcode=="2")' zap-report.json | wc -l)
            if [ "$FAIL" -gt 0 ]; then STATUS="FAIL"; COLOR="Red"; else STATUS="PASS"; COLOR="Green"; fi
          else
            STATUS="NO REPORT"; COLOR="Yellow"; FAIL=0; WARN=0
          fi

          echo "<table border='1'>
          <tr><th>Security Check</th><th>Status</th><th>High</th><th>Medium</th></tr>
          <tr>
            <td>OWASP ZAP</td>
            <td>$STATUS</td>
            <td>$FAIL</td>
            <td>$WARN</td>
          </tr>
          </table>" > zap-summary.html

      - name: Generate Aggregate Table
        run: |
          echo "<table border='1'>" > agg.html
          echo "<tr><th>Transaction</th><th>Total</th><th>Avg</th></tr>" >> agg.html
          echo "</table>" >> agg.html

      - name: Publish to Confluence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const baseUrl = process.env.CONFLUENCE_BASE_URL;
            const email = process.env.CONFLUENCE_EMAIL;
            const token = process.env.CONFLUENCE_API_TOKEN;
            const spaceKey = process.env.CONFLUENCE_SPACE_KEY;

            const parentId = "6094858";
            const indexPageId = "6094858";

            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json"
            };

            const now = new Date().toLocaleString("en-GB").replace(",", "");

            async function api(url, method="GET", body=null){
              const res = await fetch(url,{method,headers,body:body?JSON.stringify(body):null});
              const text = await res.text();
              if(!res.ok) throw new Error(text);
              return text?JSON.parse(text):{};
            }

            const pwRows = fs.readFileSync('pw_runs_summary.txt')
              .toString()
              .split('\n')
              .slice(1)
              .map(line => {
                if (!line) return "";
                const [a,b,c,d,e,f] = line.split(',');
                return `<tr><td>${a}</td><td>${b}</td><td>${c}</td><td>${d}</td><td>${e}</td><td>${f}</td></tr>`;
              }).join('');

            const zapSummary = fs.readFileSync('zap-summary.html').toString();

            const CONTENT = `<h1>🚀 Performance & UI Test Report</h1>

            <h2>📏 SLA Configuration</h2>
            <table border='1'>
            <tr><th>Metric</th><th>Threshold</th></tr>
            <tr><td>Avg (ms)</td><td>${process.env.SLA_AVG}</td></tr>
            <tr><td>P90 (ms)</td><td>${process.env.SLA_P90}</td></tr>
            <tr><td>Error %</td><td>${process.env.SLA_ERR}</td></tr>
            </table>

            <h2>⏱ Execution Timeline</h2>
            <table border='1'>
            <tr><th>Type</th><th>Start</th><th>End</th></tr>
            <tr><td>JMeter</td><td>${fs.readFileSync('jm_start.txt')}</td><td>${fs.readFileSync('jm_end.txt')}</td></tr>
            <tr><td>Playwright</td><td>${fs.readFileSync('pw_start.txt')}</td><td>${fs.readFileSync('pw_end.txt')}</td></tr>
            </table>

            <h2>📈 Transaction-Level Aggregate</h2>
            ${fs.readFileSync('agg.html')}

            <h2>🎭 Playwright Summary</h2>
            <table border='1'>
            <tr><th>Run</th><th>Start</th><th>End</th><th>Duration</th><th>Passed</th><th>Failed</th></tr>
            ${pwRows}
            </table>

            <h2>🔐 Security Summary</h2>
            ${zapSummary}

            <h2>📎 Attachments</h2>
            <ac:structured-macro ac:name="attachments"/>`;

            const title = `Performance Report - ${now}`;

            const child = await api(`${baseUrl}/rest/api/content`,"POST",{
              type:"page",
              title:title,
              ancestors:[{id:parentId}],
              space:{key:spaceKey},
              body:{storage:{value:CONTENT,representation:"storage"}}
            });

            const link = child._links.base + child._links.webui;

            const parent = await api(`${baseUrl}/rest/api/content/${indexPageId}?expand=body.storage,version`);

            let html = parent.body.storage.value;

            const row = `<tr><td></td><td>${now}</td><td><a href="${link}">${title}</a></td><td></td></tr>`;

            html = html.includes("</tbody>")
              ? html.replace("</tbody>", row + "</tbody>")
              : html + `<table><tbody><tr><th>Sr.No</th><th>Created At</th><th>Page</th><th>Status</th></tr>${row}</tbody></table>`;

            await api(`${baseUrl}/rest/api/content/${indexPageId}`,"PUT",{
              id:indexPageId,
              type:"page",
              title:parent.title,
              version:{number:parent.version.number+1},
              body:{storage:{value:html,representation:"storage"}}
            });

            require('fs').appendFileSync(process.env.GITHUB_ENV,`PAGE_ID=${child.id}\n`);

      - name: Upload Attachments
        run: |
          set +e

          upload() {
            FILE=$1
            if [ -f "$FILE" ]; then
              curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
                -X POST -H "X-Atlassian-Token: no-check" \
                -F "file=@$FILE" \
                "$CONFLUENCE_BASE_URL/rest/api/content/$PAGE_ID/child/attachment"
            fi
          }

          upload results.jtl

          zip -r jmeter-report.zip jmeter-report
          upload jmeter-report.zip

          upload zap-report.html

          if [ -d "pw-results" ]; then
            for f in pw-results/*.json; do
              [ -f "$f" ] && upload "$f"
            done
          fi
