name: Security Testing Pipeline

on:
  push:
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # --- Start Juice Shop ---
      - name: Run Juice Shop
        run: docker run -d -p 3000:3000 bkimminich/juice-shop

      - name: Wait for app
        run: |
          until curl -s http://localhost:3000/#/ > /dev/null; do
            echo "Waiting for Juice Shop..."
            sleep 5
          done

      # --- SAST ---
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/security-audit"

      # --- Dependency scan ---
      
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
          echo "Using npm ci"
            npm ci
          else
          echo "No lockfile, falling back to npm install"
          npm install
          fi

      - name: Run npm audit
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=high || true

      - name: Fix workspace permissions (ZAP safe)
        run: sudo chmod -R a+rwX $GITHUB_WORKSPACE

      # --- DAST ---
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-r zap-report.html -J zap-report.json -m 5"
          allow_issue_writing: true

      - name: Debug files
        run: |
          echo "Files after ZAP:"
          ls -la

      # --- Publish to Confluence ---
      - name: Publish to Confluence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { FormData, Blob } = global;

            const baseUrl = process.env.CONFLUENCE_BASE_URL;
            const email = process.env.CONFLUENCE_EMAIL;
            const token = process.env.CONFLUENCE_API_TOKEN;
            const spaceKey = process.env.CONFLUENCE_SPACE_KEY;

            const parentId = "13238273";

            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json"
            };

            function cleanText(text = "") {
              return text.replace(/<[^>]*>?/gm, "").trim();
            }

            async function api(url, method = "GET", body = null) {
              const res = await fetch(url, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
              });

              const text = await res.text();
              if (!res.ok) throw new Error(text);

              return text ? JSON.parse(text) : {};
            }

            const now = new Date().toLocaleString("en-GB").replace(",", "");

            // --- Parse ZAP ---
            const zap = fs.existsSync("zap-report.json")
              ? JSON.parse(fs.readFileSync("zap-report.json", "utf8"))
              : null;

            let high = 0, medium = 0, low = 0;
            let findings = [];

            if (zap) {
              zap.site.forEach(site => {
                site.alerts.forEach(alert => {
                  const risk = alert.riskcode;
                  const count = alert.instances ? alert.instances.length : 1;

                  if (risk === "3") high += count;
                  else if (risk === "2") medium += count;
                  else if (risk === "1") low += count;

                  if (risk === "3" || risk === "2") {
                    findings.push({
                      name: alert.name,
                      risk: alert.riskdesc,
                      desc: alert.desc || "",
                      solution: alert.solution || ""
                    });
                  }
                });
              });
            }

            const topFindings = findings.slice(0, 5);

            let panelHtml = "";
            let tableRows = "";

            topFindings.forEach(f => {
              const risk = (f.risk || "").split(" ")[0];

              panelHtml += `
              <ac:structured-macro ac:name="panel">
                <ac:parameter ac:name="title">🚨 ${f.name} (${risk})</ac:parameter>
                <ac:rich-text-body>
                  <p><strong>📝 Description</strong></p>
                  <p>${cleanText(f.desc).substring(0,200)}...</p>
                  <p><strong>🛠 Recommendation</strong></p>
                  <p><em>${cleanText(f.solution).substring(0,200)}...</em></p>
                </ac:rich-text-body>
              </ac:structured-macro>
              `;

              tableRows += `
              <tr>
                <td><strong>${f.name}</strong></td>
                <td>${f.risk}</td>
                <td>${cleanText(f.desc).substring(0,120).replace(/\./g, '.<br/>')}</td>
                <td><em>${cleanText(f.solution).substring(0,120)}...</em></td>
              </tr>
              `;
            });

            if (tableRows === "") {
              tableRows = `<tr><td colspan="4">No high or medium findings</td></tr>`;
            }

            const status =
              high > 0 ? "❌ High Risk Detected" :
              medium > 0 ? "⚠️ Medium Risk Detected" :
              "✅ Low Risk / Clean";

            // --- Create page ---
            const initialContent = `
            <h1>🔐 Security Scan Report</h1>
            <p><strong>Status:</strong> ${status}</p>
            <p><strong>Scan Time:</strong> ${now}</p>
            <p><strong>Target:</strong> OWASP Juice Shop</p>

            <table>
            <tr><th>Severity</th><th>Count</th></tr>
            <tr><td>🔴 High</td><td>${high}</td></tr>
            <tr><td>🟠 Medium</td><td>${medium}</td></tr>
            <tr><td>🟢 Low</td><td>${low}</td></tr>
            </table>

            <p>Uploading report...</p>
            `;

            const newPage = await api(`${baseUrl}/rest/api/content`, "POST", {
              type: "page",
              title: `Juice Shop Scan - ${now}`,
              ancestors: [{ id: parentId }],
              space: { key: spaceKey },
              body: {
                storage: {
                  value: initialContent,
                  representation: "storage"
                }
              }
            });

            const pageId = newPage.id;

            // --- Upload report ---
            if (fs.existsSync("zap-report.html")) {
              const fileBuffer = fs.readFileSync("zap-report.html");

              const form = new FormData();
              form.append("file", new Blob([fileBuffer]), "zap-report.html");

              const res = await fetch(
                `${baseUrl}/rest/api/content/${pageId}/child/attachment`,
                {
                  method: "POST",
                  headers: {
                    "Authorization": `Basic ${auth}`,
                    "X-Atlassian-Token": "no-check"
                  },
                  body: form
                }
              );

              if (!res.ok) {
                throw new Error("Attachment upload failed");
              }
            }

            // --- Update page ---
            const updatedContent = `
            <h1>🔐 Security Scan Report</h1>

            <p><strong>Status:</strong> ${status}</p>
            <p><strong>Scan Time:</strong> ${now}</p>
            <p><strong>Target:</strong> OWASP Juice Shop</p>

            <table>
            <tr><th>Severity</th><th>Count</th></tr>
            <tr><td>🔴 High</td><td>${high}</td></tr>
            <tr><td>🟠 Medium</td><td>${medium}</td></tr>
            <tr><td>🟢 Low</td><td>${low}</td></tr>
            </table>

            <h2>🚨 Key Findings</h2>
            ${panelHtml}

            <table>
            <tr>
              <th>Issue</th>
              <th>Risk</th>
              <th>Description</th>
              <th>Recommendation</th>
            </tr>
            ${tableRows}
            </table>

            <h2>📎 Full report attached below</h2>
            <p>
            <a href="${baseUrl}/download/attachments/${pageId}/zap-report.html">
            Download Full ZAP Report
            </a>
            </p>
            `;

            const page = await api(
              `${baseUrl}/rest/api/content/${pageId}?expand=version,title`
            );

            await api(`${baseUrl}/rest/api/content/${pageId}`, "PUT", {
              id: pageId,
              type: "page",
              title: page.title,
              version: { number: page.version.number + 1 },
              body: {
                storage: {
                  value: updatedContent,
                  representation: "storage"
                }
              }
            });

      # --- Cleanup ---
      - name: Stop Juice Shop
        if: always()
        run: docker stop $(docker ps -q)
