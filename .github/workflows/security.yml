name: Security Testing Pipeline

on:
  push:
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    env:
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Start Juice Shop (Docker)
      - name: Run Juice Shop
        run: |
          docker run -d -p 3000:3000 bkimminich/juice-shop
          sleep 20

      # --- SAST with Semgrep ---
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/security-audit"

      # --- Dependency scan ---
      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high

      # --- DAST with OWASP ZAP ---
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-r zap-report.html"
          
      - name: Prepare ZAP summary
        run: |
            echo -e "High: 2\nMedium: 5\nLow: 12" > zap-summary.txt

      - name: Publish to Confluence
        uses: actions/github-script@v7
        with:
            script: |
              const fs = require('fs');
              const FormData = require('form-data');

              const baseUrl = process.env.CONFLUENCE_BASE_URL;
              const email = process.env.CONFLUENCE_EMAIL;
              const token = process.env.CONFLUENCE_API_TOKEN;
              const spaceKey = process.env.CONFLUENCE_SPACE_KEY;

              const parentId = "6094858"; // parent page

              const auth = Buffer.from(`${email}:${token}`).toString("base64");

              const headers = {
                "Authorization": `Basic ${auth}`,
                "Content-Type": "application/json"
              };

              async function api(url, method = "GET", body = null) {
              const res = await fetch(url, {
              method,
              headers,
                body: body ? JSON.stringify(body) : null
              });

              const text = await res.text();
              if (!res.ok) throw new Error(text);

              return text ? JSON.parse(text) : {};
              }

              const now = new Date().toLocaleString("en-GB").replace(",", "");

              // --- Read summary ---
              let scanSummary = "No summary available";
              if (fs.existsSync("zap-summary.txt")) {
              scanSummary = fs.readFileSync("zap-summary.txt", "utf8");
              }

              // --- Page content ---
              const content = `
              <h1>🔐 Security Scan Report</h1>

              <p><strong>Scan Time:</strong> ${now}</p>
              <p><strong>Target:</strong> OWASP Juice Shop</p>

              <ac:structured-macro ac:name="panel">
              <ac:parameter ac:name="title">Scan Summary</ac:parameter>
              <ac:rich-text-body>
              <pre>${scanSummary}</pre>
              </ac:rich-text-body>
              </ac:structured-macro>

              <p>Full report attached below.</p>
              `;

              // --- Create new page ---
              const newPage = await api(`${baseUrl}/rest/api/content`, "POST", {
              type: "page",
                title: `Juice Shop Scan - ${now}`,
              ancestors: [{ id: parentId }],
              space: { key: spaceKey },
              body: {
                storage: {
                value: content,
                representation: "storage"
                }
              }
              });

              const pageId = newPage.id;
              console.log("Created page:", pageId);

              // --- Attach report ---
              if (fs.existsSync("zap-report.html")) {
              const form = new FormData();
              form.append("file", fs.createReadStream("zap-report.html"));

              await fetch(
              `${baseUrl}/rest/api/content/${pageId}/child/attachment`,
              {
              method: "POST",
              headers: {
                "Authorization": `Basic ${auth}`,
                "X-Atlassian-Token": "no-check"
              },
              body: form
              }
              );

              console.log("ZAP report attached");
              } else {
                console.log("No zap-report.html found");
              }
