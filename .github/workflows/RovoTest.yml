name: Rovo NFT Analysis

on:
  workflow_dispatch:

jobs:
  rovo-nft-analysis:

    runs-on: ubuntu-latest

    env:
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check JTL file
        run: |
          echo "Checking JTL file..."
          ls -lh data/Rovo_Test1.jtl

      - name: Run Rovo NFT Analysis
        run: |
          chmod +x scripts/rovo_nft_analysis.sh
          ./scripts/rovo_nft_analysis.sh

      - name: Upload Rovo analysis
        uses: actions/upload-artifact@v4
        with:
          name: rovo-nft-analysis
          path: rovo-output/
